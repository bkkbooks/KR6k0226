能財施法施平等施所以三賢冠捨心於首十地修檀度為先故我釋迦世尊於無量劫中修菩薩行時投身飼虎割肉餧鷹形剜千孔以然燈目摘雙睛而濟病至若支節肝膽頭舌髓腦國城妻子象馬七珍等皆以忍力捨施成就無我之檀波羅蜜而用求無上玅道救度法界有情觀三千大千世界無有芥子許非是如來因地中捨身命處一佛如是佛佛皆然汝等雖云初心入道而忍力未具人法未空既發菩提心求受菩薩戒者於斯大願慎必當堅於斯苦行慎必當行汝等人人勿懷怯怖果能以此不住相清淨捨心或然一香或然一燈供養十方諸佛於中所求者不為人天福報權乘小果願得無上菩提拯拔法界有情於當來世如藥王之焚身二祖之斷臂乃至無量無邊求法利生難行苦行悉從今日受菩薩戒然一香一燈之微小因始終究竟圓滿檀波羅蜜也汝等今聞我語若意涉躊躇心生疑退即非真正師子兒亦非大乘根性者如我不遵佛制先行開導便為汝等授大乘戒即非大乘律師而犯倒說經律戒矣我已遵制為說汝等今已諦聽鳴尺一下再問汝等汝人人能信解奉行否眾答能依教奉行和尚云既能依教奉行待汝等然燈然香供佛發願已來曰臨壇領受菩薩戒法引禮云諸比丘等一齊起立聞磬聲頂謝三拜撩衣拜已起具分班為首者送和尚歸方丈送和尚已回堂禮謝眾引禮師各歸本堂少息片時引禮復將求菩薩戒者同詣大殿然香燈已畢如常普禮諸佛菩薩發十大願而退至初夜前仍令一齊上殿通宵頂禮本師釋迦牟尼佛德號以祈加護願入佛乘
