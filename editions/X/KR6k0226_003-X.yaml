body:
  text: 金陵寶華山司律沙門讀體撰三壇進菩薩戒前請戒懺悔儀通啟二師第一按菩薩戒羯磨經云若諸菩薩欲受菩薩戒時先應為說菩薩法藏摩怛哩迦菩薩學處及犯處相令其聽受以慧觀察自所意樂堪能思擇受菩薩戒非為他勸非為勝他當知是名堅固菩薩堪受菩薩淨戒準經所明故知凡受菩薩戒先當請戒開示次則審懺問難如法授受匪藉引導則發請無繇是以先須通白輔化二師然後啟請和尚其請戒開導之法須在正授戒前二三日於午後令淨人灑掃法堂中敷高座若無淨人新比丘亦得至時鳴椎集眾然此中集者非但局於比丘凡欲求菩薩戒之比丘尼式叉摩那沙彌沙彌尼優婆塞優婆夷皆應同集若眾多應以十比丘往請引禮師若少四人乃至極少惟幾比丘者即可同徃到已一觸禮延至法堂中普同作禮三拜起立一為首者合掌白云我比丘某甲等今欲進求菩薩大戒於諸儀則罔諳規繩復懇諸師幸為示導引禮云汝等比丘若有後六眾人在內隨類加之既能增心增戒利己利人法門熾盛功德難思我今先將汝等通白二師乞請同詣方丈答已同一觸禮起分兩立於時二引禮各將二比丘分請二師請至法堂已引禮呼眾如常作禮三拜長跪合掌二引禮向二師一觸禮起立叉手代眾白云彼比丘某甲等後六眾隨有加之今欲乞圓菩薩大戒故先通白二阿闍黎師惟願勿悋利物之婆心勗成新學之上志欣移法趾同詣方丈啟請和尚臨堂曲垂開示令彼眾等聞解受持不昧正修慈愍故白已呼眾作禮一拜闍黎師云諸比丘等有後六眾隨加之汝今意欲啟請和尚求圓菩薩妙善戒法者可謂真佛弟子是名大道心人少間和尚若慈允臨堂開導之時汝等各各諦聽思惟可能堪受此戒良以菩薩誓願深廣行門無量非同比丘向所修持倘有纖毫怯怖機器卑劣大戒難圓所謂假使鐵輪頂上旋終不退失菩提心如是行願堅固方名受持菩薩戒者故我二師先為告諭汝等人人各懷恭謹同往方丈迎請和尚引禮呼眾作禮三拜起分左右其為首者隨二師詣方丈餘者立定請戒開導第二請和尚時可令九人一人執香前行次引禮鳴磬次二師餘眾末行至方丈禮儀如常和尚臨堂陞座先二師禮畢歸位引禮向上展大具三拜長跪合掌白云仰白和尚大慈忍聽彼比丘某甲等有餘眾隨加之今欲求圓菩薩淨戒故先恭詣座前頂禮啟白願開甘露解脫法門傳授金剛光明寶戒不捨慈悲幸垂䇿導白已三拜起具復位呼云上香復位諸比丘等如上加名一齊向上排班展大具聞磬聲頂禮三拜撩衣拜已長跪合掌闍黎師云諸比丘等所有乞戒言辭為首者代眾至誠作白首者白云我比丘某甲等久已毀形離俗每懷進道無門幸值大和尚戒德山高毗尼海湛繇是得以登壇稟具始預僧倫更欲息慮投誠重增大戒故今頂禮座前悃愊伸請惟願鑒精䖍於一念降悲愍於羣機均賜菩薩妙善淨戒令某甲等修學大乘契悟心地即以四弘化導之功用酬施戒法乳之德下情不勝懇禱之至白已引禮呼眾頂禮一拜合掌長跪一心諦聽和尚撫尺云諸比丘等若有餘眾隨類加之汝今懇切至誠乞求菩薩妙善戒法者先須以三種決定深固大信發無上菩提心而求之若信不決定則不能斷除疑網心不深固則不能勇猛勤修所以阿耨多羅三藐三菩提心安住大乘如山如海不動不搖者皆繇具此一信永信之力也何等為三一者決定深信一切眾生皆具如來智慧德相只因妄想執著而不證得故今勤修勝行誓成覺道願度眾生咸登佛果故梵網經云汝是當成佛我是已成佛常作如是信戒品已具足二者決定深信波羅提木叉戒是菩提涅槃修證之本因若無戒為本修因如蒸砂作飯縱經塵劫終不能成故華嚴經云戒為無上菩提本應當具足持淨戒若能堅持於淨戒是則如來所讚歎涅槃經云欲見佛性證大涅槃必須深心修持淨戒三者決定深信一切諸佛法報化身清淨光明無邊相好皆依持戒而得莊嚴成就故薩遮尼乾子經云如來功德身以戒而為本故知上求佛果克備二嚴下化眾生圓滿萬行有戒則修證不虗無戒則徒勞何益汝等若具此三種信力者方可感求娑婆教主釋迦牟尼佛為得戒本師和尚大智文殊師利菩薩為羯磨阿闍黎一生補處彌勒菩薩為教授阿闍黎十方現在一切諸佛為尊證師十方一切菩薩為同學侶吾雖受請陞座但是汝等教誡法師名曰秉戒和尚謂秉宣佛制教誡後學故若於來朝入壇正受戒時汝等人人皆要專注一境頓息諸緣此身雖在師前而心必觀想諸佛海會須知菩薩淨戒非淺浮之信散亂之心而可納受故經云三白受戒羯磨畢竟從此無間普於十方無邊無際諸世界中現住諸佛諸大菩薩前法爾相現繇此表示如是菩薩已受菩薩所受淨戒爾時諸佛菩薩覩是菩薩法爾之相知某世界某名菩薩某菩薩所正受菩薩所受淨戒一切於此受戒菩薩如子如弟生親善意眷念憐愍繇諸佛菩薩眷念憐愍令是菩薩希求善法倍復增長無有退減如是菩薩所受淨戒於餘所受淨戒最勝無上無量無邊大功德藏之所隨逐第一最上善心意樂之所發起普能滅除於一切有情一切種惡行一切別解脫律儀計分算分喻分乃至鄔波尼殺曇分亦不及一攝受一切大功德故受此戒已雖復轉身徧十方界在在生處不捨菩薩淨戒律儀繇是菩薩不捨無上菩提大願亦不上品纏犯他勝處法若轉受餘生忘失本念值遇善友為欲覺悟菩薩戒念雖數重受而非新得準斯經文則知受持比丘戒名曰僧戒當在僧中禮請十師白四羯磨而得但盡今生形壽受持菩薩戒名曰佛戒應於師前啟白諸佛三番羯磨而得直至果覺後身所以釋迦世尊文殊彌勒為菩薩戒之三師諸佛為其證明而諸佛菩薩未離真際求戒之人實住此方能令授受獲益者良繇眾生機感諸佛道交如子愈孝而母愈憐譬水愈清而月愈顯受大乘戒為真佛子諸佛菩薩慈悲護念亦復如是來日為汝等欽遵大乘經律結壇敷座集眾啟聖易比丘比丘尼式叉摩那沙彌沙彌尼優婆塞優婆夷之自利心而為菩薩嚴土利生之廣大心轉比丘比丘尼式叉摩那沙彌沙彌尼優婆塞優婆夷之別解脫戒而為菩薩保解脫之三聚戒文中總舉七眾隨有者一一加之然此三聚妙戒體是無作遍周法界量等塵沙假色表顯雖云受乃全性起修不二而二雖云持乃全修在性二而不二此則佛種從緣起性修交成故得斯體已任運止惡行善任運利物濟生於正止行利生之間實無利生止行可得以諸法無生一道真淨故起信論云以知法性無染污故隨順修行尸波羅蜜而此性戒之性佛生共具蠢動不無有性即有心有心皆成佛梵網經云金剛光明寶戒是一切佛本源一切菩薩本源佛性種子一切眾生皆有佛性一切意識色心是情是心皆入佛性戒中但恐汝等若不能發無上菩提大願及現身中有犯七逆罪者雖佛性之理體人人本具未曾欠少而終難發起戒之當體經律明條應當詰問汝等少頃且隨眾引禮大德今夜入懺摩堂中向羯磨師前先將各人本所受持戒品其間若染若淨一一發露次依大乘所遮七逆詳細審明若根本重戒不破七惡逆罪不犯方可如律如法清淨授受諸佛讚善龍天衛守所謂毗尼住世而正法得以久住汝等能依教奉行否眾齊答云能依教奉行引禮云諸比丘等有餘加之一齊起立聞磬聲禮謝三拜撩衣拜已起具分班迎請者出班送和尚歸方丈禮儀如常送已仍至堂中禮送二師並謝引禮師畢次第各還本所以候初夜問懺審戒遮第三梵網經云與人授戒時不得揀擇一切國王王子大臣百官比丘比丘尼信男信女婬男婬女十八梵天六欲天子無根二根黃門奴婢一切鬼神盡得受戒又云若欲受戒時師應問言現身不作七逆罪耶菩薩法師不得與七逆人受戒故知理性無別有心者盡皆通收事障須防無犯者乃可容受既於不揀擇中而分揀擇然審問中復有正權頓漸之殊故今彚之為四以便懸當臺之明鏡鑒所受之機宜若不諳練於先臨時成非莫曉一者出家男女若受持式叉摩那沙彌沙彌尼戒或學戒年滿無缺或身器完美無遮已經登壇白四羯磨曾圓比丘比丘尼戒今復增發大心乞求三聚繇其行布靡逾不廢住持僧寶如法如律謂之正受受已名曰菩薩比丘菩薩比丘尼也二者若式叉摩那沙彌沙彌尼或學戒生年未滿縱滿諸根不具倚能發菩提心堪行菩薩行雖具足僧倫不收於平等佛性可攝以其不歷近圓即求三聚戒級雖越佛慈暫開謂之權受受已名曰菩薩式叉摩那菩薩沙彌菩薩沙彌尼也三者若居家男女崇信三寶樂修十善或受五支學處慎守多年或持八關齋戒嚴遵一日今始更發勝心求受菩薩大戒以其自小進大信智轉增謂之漸受受已名曰菩薩優婆塞菩薩優婆夷也四者若世俗男女多劫已植深厚善根此生迷著不速返惺倐爾覺照立地悲忻一念信歸三寶懇求大乘戒法願力弘深同事攝化以其未曾久持居家戒品一旦疾稟菩薩學處謂之頓受受已名曰菩薩近事男菩薩近事女也此之四種若審懺時仍分四別審第一種人者若是比丘嚴問所持二百五十戒法若是比丘尼詳審本法三百四十八戒至於七遮二部通詰苟根本毀破應當羯磨滅擯若七逆有犯當如律制所遮設餘干違容悔仍淨審第二種人者若是式叉摩那此云學戒女佛制令學三法故若審懺時應一一逐問一學根本四重戒是二學六法謂染心相觸盜減五錢斷畜命小妄語非時食故飲酒是三學行法謂大尼諸戒中威儀是也若是沙彌沙彌尼唯審本戒十章其七遮重罪三眾俱問如斯三眾之中或根本七遮有犯一一依律擯除若學戒女六法不淨更於二年羯磨繇彼既受式叉摩那戒即非沙彌尼眾所攝復於式叉摩那缺學又非真淨學戒之女而兩無攸歸三聚基乏故不能進受菩薩戒也其小三眾唯此學戒所制倍嚴於沙彌沙彌尼故也審第三種人者若是五戒近事男女於中受有滿多半少一分不同應隨所受一一詳問不得為少分者而問多分為滿分者而問半分若是八戒近事男女彼所受者既異終身居家五戒故審詰時但問一日一夜之持犯又則八戒制婬於一日夜全斷不開非同五戒止禁邪婬而已如審七逆四輩無殊其間或於四重七逆有犯一一者當須遮止餘聽悔除仍許進受審第四種人者彼等一向未稟尸羅今始初發大心求受應準善生經中問其七種戒障若此善信男女不干七障者先當與受優婆塞優婆夷之五戒然斯俗諦五禁乃在家菩薩戒之原基也即於當日復欽梵網經再審七逆若無犯者三聚方進今雖五戒纔受七逆豈必有干佛教有遮仍須遵問凡作法時應在後日分其淨堂敷座設辦莊嚴籤班出入一切儀式皆同受具無殊至時鳴椎集眾引禮先至法堂眾向作禮三拜令四為首者徃請受差驗繳書記巡視諸師禮儀如前不異引禮師次將五人一人執香往請羯磨師至堂禮佛就座拈香眾舉香讚竟引禮云上香復位迎請者向上排班展具聞磬聲作禮三拜撩衣拜已起具各歸本班受差諸師禮儀囑辭皆於二壇儀中詳明此不再出引禮云諸比丘等各稟䖍誠隨我音聲齊誦大悲神呪求加護以淨法筵仗威力而蠲魔障誦此神呪三遍已舉云南無甘露王菩薩摩訶薩三聲諸比丘等一齊向上排班展半具聞磬聲作禮三拜撩衣拜已長跪合掌夫法器久成猶恐琢磨之未至聖階欲進先求行履之有初今則具戒既登聖心重礪故我為汝眾等焚香敷座恭請上某下某律師為審戒問遮懺悔阿闍黎請師之語汝合自陳恐汝未能我今教汝各稱法名眾各稱名其餘言辭皆隨我道大德一心念我比丘某甲等餘眾加名今請大德為審戒問遮懺悔阿闍黎願大德為我作審戒問遮懺悔阿闍黎我依大德故得入菩薩清淨位慈愍故三請三拜羯磨師撫尺云諸比丘有餘眾加之汝等既已殷勤三請我今為汝作審戒問遮懺悔阿闍黎所有言教各須諦聽夫教對機談先漸後頓律因事制繇身及心身苟不淨心戒何從今既五篇固守三聚更增願樂四弘匪專自利斯則發廣大之因心直趨寶所希如來之果德不滯化城具此勝懷可謂上善但恐浮囊有損破器難盛聖制既違梵行何立往愆未雪修證無繇故毗尼藏云犯四性重者退失道果譬喻斫頭人不復還活斷心樹不復更生缺鼻鍼不堪復用分破石不復還合此是汝等本受戒中法所不容者也又大乘梵網經云若現身有七遮罪者師不應與受戒若無七遮者得與受戒以是觀之小乘七眾犯重大乘進受無容大乘若犯七遮一槩盡揀有據雖曰罪無自性理具真常必要事不毀心道方合節今故先依毗尼藏審其所受比丘戒中一一相內持犯完缺等事此單為比丘而言若有餘六眾同請審懺者可改文云審其所受比丘比丘尼式叉摩那沙彌沙彌尼優婆塞優婆夷戒中一一相內持犯完缺等事今總舉七眾之名以便臨時隨有取用次遵大乘教中揀其七遮重惡我今逐一問汝汝等逐一實答若不傾心披膽如實而答者昔惡既覆新善難生縱使隨眾懺悔此罪何繇得除受戒必不得戒仍加故妄語罪當思菩薩大戒原於心地心地夾襍便非戒器首棱嚴經云汝今欲研無上菩提當以直心詶我所問鳴尺云汝等能依教奉行否眾齊答云依教奉行其所審問者若僅十餘人即隨審戒相不必令起出而復入或有比丘尼等六眾在內應即令出別召審之以其戒相不同故若比丘眾多者可令出堂依籤班次入堂聽審恐其問答不聞言音難解故引禮云諸比丘等一齊起立聞磬聲作禮三拜撩衣拜已起具凡為首者領眾出堂集候毋得散亂待呼召時各依班次從左頰門至驗籤師所逐一依次進堂到師座前審答已竟從右頰門至繳籤師所逐一依次出堂其第一班在堂伺侯餘且暫退俟餘眾出堂已呼云第一班近前向上排班若堂窄分列兩行堂寬一班列之展半具聞磬聲作禮三拜撩衣拜已長跪合掌各各作觀運心三稱南無十方常住三寶三稱已各稱自己法名稱已師撫尺云諸比丘我今問汝本所受持四波羅夷法汝等應當諦實而答第一犯不淨行受婬欲法戒汝於是中有犯否有無實答然此中所問戒相不能全錄廣文恐人眾延遲但撮其綱目以問之第二有主物不與盜心取戒汝於是中有犯否有無實答第三故斷人命歎譽快勸死戒如前第四實無所知自言叉得上人法戒如前比丘犯此四法不得與諸比丘布薩羯磨共住謂之破根本當如法如律如佛所教以白四羯磨滅擯退失無道果分不得進菩薩大戒準目連問經犯波羅夷罪者當墮焰熱地獄中師撫尺云諸比丘我今問汝本所受持十三僧伽婆尸沙法汝等應當諦實而答第一故弄陰出精除夢中戒汝於是中有犯否有無實答第二婬欲意與女人身相觸戒如前第三與女人麤惡婬欲語戒如前第四教女人以婬法供養我戒如前第五為男女往來彼此媒嫁戒如前第六難處妨處無主自作屋不將諸比丘指授處所過量作戒如前第七難處妨處有主為己作大房不將餘比丘指授處所戒如前第八瞋恚所覆故非波羅夷比丘以無根波羅夷法謗戒如前第九以瞋恚故於異分事中取片非波羅夷比丘以無根波羅夷法謗戒如前第十欲壞和合僧受破僧法三諫不捨戒如前十一伴黨助破和合僧三諫不捨戒如前十二依聚落城邑住污他家行惡行反謗羯磨如法僧三諫不捨戒如前十三惡性不受人語三諫不捨戒如前比丘於此十三法中隨犯一一者知而覆藏應強與波利婆沙行波利婆沙竟增上與六夜摩那埵行摩那埵已仍於二十僧中出罪若僧不滿二十罪不得出若不依律懺悔出罪準經云當墮大嘷呌地獄中師撫尺云諸比丘我今問汝本所受持二不定法汝等應當諦實而答第一共女人獨在覆障處可作婬處坐說非法語若波羅夷若僧伽婆尸沙若波逸提於此三法中治戒汝於是中有犯否有無實答第二共女人在露現處不可作婬處坐說非法語若僧伽婆尸沙若波逸提於此二法中治戒如前比丘犯此二法治罪輕重不定待情真事實或以三法治或以二法治或以一法治故曰不定法師撫尺云諸比丘我今問汝本所受持三十尼薩耆波逸提法汝等應當諦實而答第一畜長衣過十日戒汝於是中有犯否有無實答第二離三衣異處宿除僧羯磨戒如前第三畜非時衣過一月戒如前第四取非親里比丘尼衣除貿易戒如前第五使非親里比丘尼浣染打故衣戒如前第六從非親里居士居士婦乞衣除奪衣失衣燒衣漂衣戒如前第七若奪衣失衣燒衣漂衣非親里居士居士婦與衣不知足受戒如前第八居士居士婦為比丘辦衣價不受自恣請到其家讚歎為好故得衣戒如前第九二家為比丘辦衣價不受自恣請到二家讚歎為好故得衣戒如前第十施主送衣價與比丘執事人執事人不與比丘往取三反憶念過五六反求得衣戒如前十一襍野蠶綿作新臥具戒如前十二新純黑羺羊毛作臥具戒如前十三作新臥具不用二分純黑羊毛三分白四分牻戒如前十四臥具未及六年不捨更作新臥具除僧羯磨戒如前十五作新坐具不取故者縱廣一磔手揲著新者戒如前十六自持羊毛過三由旬戒如前十七使非親里比丘尼浣染擘羊毛戒如前十八自手捉錢金銀若使人捉若置地受者戒如前十九種種賣買寶物戒如前二十種種販賣戒如前二十一畜長鉢過十日戒如前二十二畜鉢減五綴不漏更求新者戒如前二十三自乞縷線使非親里織