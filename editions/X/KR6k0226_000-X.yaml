body:
  text: 傳戒正範序善乎柳河東曰儒以禮立仁義佛以律持定慧故我世尊五時唱教先梵網於羣經雙樹潛輝寄金言於戒學所以眼目人天津梁凡聖無異說矣無柰法久弊滋以致戒壇封錮賴吾祖父靈谷千華二老人乘大願力再闢巨荒薄海遐陬咸知秉受南山之道鬱然中興及先師西邁主律無人三學搖搖莫知宗仰吾教授本師見月體和尚秉鐵石心具金剛骨精淹五部嗣主千華慨今海內放戒開壇所至多有考其學處則懵昧無聞視其軌儀則疎慵失準倉皇七日便畢三壇大小乘而不分僧尼部以無別心輕露懺羯磨視為故文罔諳開遮問難聊云塞白一期解散挂名祇在田衣三業荒唐戒本束歸高閣列聖戒法等同兒戲而毗尼大壞矣和尚憫之內重躬行外嚴作法兼勤著述以利方來於兩乘布薩律制僧行外復為撰輯傳戒正範三壇軌則巨細有條七眾科儀精詳不紊勤開示則智愚灌以醍醐謹羯磨則輕重揀於絲髮不違古本別出新型如滹沱之七事戈甲忽新光弼之三軍旌旗一變允篇聚之南車而木叉之杲日矣此本流布用為章程非獨專門弘律者肅有規繩即禪律兼行者咸知矩𤐰壇法自此集成更非從前綿蕞古云三代禮樂盡在是矣凡據位登壇者倘心存二利慕律社之精嚴法懼七非惡時師之簡陋執此以往可也順治庚子歲姑洗月上巳日住南康雲居山千華同門戒弟子戒顯頓首拜題傳戒正範目錄卷一初壇授沙彌戒前請戒懺悔儀第一淨堂集眾法第二通啟二師法第三請戒開導法第四驗衣鉢法第五露罪懺悔法第六呈罪稱量法卷二二壇授比丘戒前請戒懺悔儀第一明習儀法第二請戒開導法第三通白二師法第四教衣鉢法第五審戒懺悔法卷三三壇授菩薩戒前請戒懺悔儀第一通白二師法第二請戒開導法第三開示苦行法卷四初壇傳授沙彌戒正範第一明請師法第二正請師法第三開導法第四明請聖法第五懺悔法第六問難法第七歸依法第八結歸法第九說戒相法第十聽教囑法二壇傳授比丘戒正範第一明僧中請師法第二正請師法第三壇主白法第四安受戒者所在第五差教授法第六教授出眾問難法第七白召入眾法第八明乞戒法第九羯磨師單白法第十正問難法第十一明授戒體法第十二正授戒體法第十三次說四墮法第十四後授四依法第十五結勸迴向法三壇傳授菩薩戒正範第一明敷座結壇法第二明請師入壇法第三明禮敬三寶法第四明正請師法第五明開導戒法第六明請聖法第七授四不壞法第八懺悔過法第九明發願法第十明發戒體法次正授戒體法第十一明宣戒相法第十二明結讚迴向法附正範辨傳戒正範目錄終
