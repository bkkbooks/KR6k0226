戒者將至界外脫衣看稽留受戒事佛言不應爾自今已去先問十三難事然後受戒壇主撫尺云僧集否維那答云僧已集問和合否答和合問未受比丘戒者出否答已出問僧今和合何所作為答受具足戒羯磨壇主鳴尺云既受具足戒今此衆中誰能作教授師往屏處與諸沙彌問難第三師於本座合掌答云我某甲堪能壇主云長老既能衆中羯磨師單白羯磨差教授師下壇問難羯磨師在本座叉手白云大德僧聽彼沙彌某甲等從和尚某甲求受具足戒若僧時到僧忍聽某甲為教授師白如是作白成否七證師在本座合掌同聲應云成七師齊答成者謂人法事三皆如律如法如佛所教此謂稱量得宜辦事克就若一不如律設答成者則事無成濟七證犯罪一字之司任實非輕今既羯磨成已教授師即當起座作禮壇主三拜轉身從南下第二級向西南繞至東北下第三級著履繞至正南朝壇上叉手一問訊從西南而出詣屏問所第六教授出衆問難法師到屏處就座而坐鳴尺一聲一引贊大德將三受具沙彌至師前接彼所捧大衣令三禮長跪復還彼衣引贊却離見聞師撫尺云諸沙彌壇上諸師作法差我下來問汝三人遮難汝莫恐怖須臾之間令汝三人升於寶壇受具足戒成大比丘入三寶數此非小緣當生慶幸夫戒者乃菩提之根本聖道之鎡基佛世利機契動便感末世澆薄聖制從緣緣集則作法功成緣散則戒德無立無作功勛不可見也託緣定其有無三衣一鉢是汝三人得戒之正緣我於未問遮難之前先與汝説衣鉢名相師指示彼身所著五七二衣及手捧之大衣云此是安陀會此是多羅僧此是僧伽黎此是鉢多羅然此衣鉢乃恆沙諸佛之標志聖賢沙門之軌儀西天九十六種外道尚不識其名字惟佛一人示此未曾有法汝今得獲受持當須珍敬愛護今此衣鉢是汝自己有否答有師云既有甚善應當受持披著諸部律中亦即加法受其五七二衣於受沙彌戒時曾令權著今唯大衣未受一引贊呼彼三人叩首起立於側先一沙彌近前捧衣對師作如是説云大德一心念我某甲此僧伽黎二十五條衣受四長一短割截衣持三説師答云善九品大衣隨品而受已受竟者過一旁口誦偈呪齊整著衣彼未受者一一對師亦如是受著衣既畢同向師前一拜長跪合掌師撫尺云諸沙彌諦聽汝從無始以來起虗妄心欺誑賢聖沈沒生死無解脫期今既投佛出家為佛弟子受佛禁戒出生死津務要斷虗妄根行真實道今正是至誠時實語時我問汝等重難輕遮汝當諦審此身有則言有無則言無汝三人不犯邊罪耶答云無師應語云量汝三人乍入道門不識此罪之名謂曾受佛戒已於淫殺盜妄四重戒中隨犯一戒即漂棄佛海邊外故名邊罪汝不有耶答無凡問難有無意在相解故中邊不相領解尚不能成其捨戒今雖問而不識者與不問無別律云不成受戒故下皆類此可以知之汝白衣時沙彌時污淨行比丘尼耶答無汝非白衣時沙彌時盜聽衆僧説戒詐稱比丘受人恭敬利養禮拜名為賊住賊住之人佛不許度汝非此人耶答非汝非外道投佛出家受佛戒已還歸外道今復重來受戒此人志性不定名為破內外道非佛法器佛不許度汝非此人耶答非汝非生謂人從生來男根不具是名生不男犍謂人以刀去男根是名犍不男妒謂男根似無見他行淫因生妒心遂感有根是名妒不男變謂能變現也遇男則變為女遇女則變為男是名變不男半謂半月能男半月不能男是名半不男五種人耶答非汝非弒父耶答無汝非弒母耶答無汝非弒阿羅漢耶答無汝非破和合僧耶答無汝非惡心出佛身血耶答無汝非諸天鬼神等變為人形而來受戒耶答非汝非龍畜等能變化者化為人形而來受戒耶答非汝三人身中各不佩帶男女二形此正乖道器汝今有耶答非諸沙彌此十三重難既無我今更問汝十六輕遮仍如前一一實答諸沙彌汝三人出家已來各各訓導是何法名各答名已此是汝三人入道之法名一生之稱呼從今受戒而去凡見和尚阿闍黎同壇尊證上中下座及宰官長者朋友知識父母師長之前皆當稱此兩字法名不得言你我某甲小僧之稱汝三人今日壇上得戒和尚是誰答云上某下某大和尚師云此是某寺某律師是汝三人得戒和尚梵語和尚此云力生三乘道力五分法身皆藉此師威力而生故云力生又云依學謂依隨此師學出世法故云依學今日受戒若無此師戒無從發汝當記取和尚尊名認取和尚慈相若不記得名字相貌受戒不得戒從今已去凡遇節臘結制解制當須懷香禮拜得戒和尚若遇路途遙遠不能侍詣當以焚香遙空稱名致敬不得慢意汝三人年滿二十否答云已滿衣鉢具足否答云具足父母聽汝出家否答云聽汝不負人錢債作不還心而來受戒否答云無汝非他家下使人否答云非汝非當朝有名有祿官人否答云非汝是丈夫否答云是丈夫本律云年滿二十者能耐寒熱風雨飢渴持戒一食忍惡言及毒蟲是丈夫位既是丈夫又要無病一疥癩二癰疽三白癩四乾痟五顛狂汝果無如是五病否答無時有此五種病人求耆婆治耆云我唯醫王及佛弟子彼思已即出家受具復就治之病好罷道還家路逢耆婆問知白佛故制不聽若準律中凡身相不具有辱大僧者皆不聽今但問最後制以攝廣遮也沙彌等我今於此問汝少間壇上衆師之前亦如是問汝如此答我少間壇上衆師之前亦如是答汝等隨我而行待我先至僧中作白僧若默然允可我以手招之時汝等即當進壇引贊呼三沙彌一拜起立於旁教授師起座出位前行三沙彌次第隨師後行將近戒壇令沙彌止立瞻觀壇上第七白召入衆法教授師至壇前立中合掌向上問訊已作如是白云大德僧聽彼沙彌某甲等從和尚某甲求受具足戒若僧時到僧忍聽我某甲已問竟聽將來白如是師白已面向沙彌招手召之云諸沙彌汝等來沙彌聞召具儀前行至壇師移步詣香案之左而立語云汝等一齊近香案前到已問訊長跪居中者拈香一瓣供養壇上諸師拈香已一拜而起隨我登壇乞戒第八明乞戒法教受師前行沙彌隨後繞至壇西脫履升第二級從西北繞至正南升第三級師歸本座前合掌而立沙彌與師相去舒手及處一行面北立定師教云展大具頂禮三拜撩衣拜已長跪合掌善男子懇切至誠仰憑清衆求哀乞戒乞戒之語汝合自陳恐汝未能我今教汝各稱法名稱已其餘言詞皆隨我道大德僧聽我某甲從和尚某甲求受具足戒我某甲今從衆僧乞受具足戒某甲為和尚願僧慈愍故濟我如是三乞一叩首畢教授師就本座而坐第九羯磨師單白法羯磨師於本座合掌先作單白羯磨已然後問難作如是白云大德僧聽此某甲等從和尚某甲求受具足戒此某甲等今從衆僧乞受具足戒某甲為和尚若僧到時僧忍聽我問諸難事白如是作白成否七證師在本座合掌答云成第十正問難法羯磨師云此安陀會鬱多羅僧僧伽黎鉢多羅今此衣鉢是汝三人有否答云有善男子諦聽今是至誠時實語時今隨所問汝當隨實而答僧祇律云若不實答便欺誑諸天魔梵沙門婆羅門世人及以如來衆僧自得大罪汝三人不犯邊罪耶答無汝非白衣時沙彌時污淨行比丘尼耶答無汝非白衣時沙彌時盜聽大僧説戒詐稱比丘受人恭敬利養禮拜名為賊住賊住之人佛不許度汝非此人耶答非汝非外道投佛出家受佛戒已還歸外道今復重來受戒此人志性不定名為破內外道非佛法器佛不許度汝非此人耶答非汝非生犍妒變半五種不男人耶答非汝非弒父耶答無汝非弒母耶答無汝非弒阿羅漢耶答無汝非破和合僧耶答無汝非惡心出佛身血耶答無汝非諸天鬼神等變為人形而來受戒耶答非汝非龍畜等能變化者化為人形而來受戒耶答非汝三人身中各不佩帶男女二形此正乖道器汝今有耶答非善男子此十三重難既無我今更問汝十六輕遮汝三人出家已來各各訓導是何法名稱名已汝三人今日得戒和尚是誰答上某下某大和尚汝三人年滿二十否答已滿衣鉢具足否答具足父母聽汝出家否答聽汝不負人錢債作不還心而來受戒否答無汝非他家下使人否答非汝非當朝有名有祿官人否答非不是丈夫否答是丈夫既是丈夫又要無病一疥癩二癰疽三白癩四乾痟五顛狂汝果無如是五病否答無第十一明授戒體法和尚撫尺云善男子前無重難後無輕遮甚是淨器衆僧同慶當授汝戒但深戒上善廣周法界量等虗空今欲進受要須緣境發心心境相容方發無作薩婆多論云凡欲受戒先與説法引導開解汝三人從無始以來於一切境上造諸惡業惡遍法界今欲受戒翻前惡境並起善心故戒法所因還遍法界故我如來隨衆生心造無邊之業制無邊之戒戒隨所制故須緣境境量雖多舉要而言不出乎二種一者情境二者非情境言情境者上至諸佛下至衆生十界正報中陰有情凡有心者皆名情境非情境者十界依報一切世間山河大地草木叢林舟車屋宅珍寶田園地水火風乃至虗空佛説聖教儒流文字形像塔廟等皆名非情境善男子既知境量如此寬廣當須依境發心心有三品中下二心劣弱非勝但能自度不能度人我今教汝發上品心求上品戒何為上品心今於我諸師座前立三種誓願一者誓斷一切惡無惡不斷二者誓修一切善無善不修三者誓度一切衆生無一衆生不度發此三種大誓願已於白四羯磨言下進受大比丘戒不為但求聲聞小果故直欲成就三聚淨戒故趣向三解脫門故正求佛果求大涅槃令法久住故發如是上品心受上品戒次當開廣汝懷者良繇戒法體周法界量等塵沙終不以汝三人現前父母所生報得狹劣身心而能容受當作虗空器量之身方能領納塵沙戒法故論云若此戒法有形色者入汝身時當作天崩地裂之聲繇是非色法故令汝不覺不知當起警懷之意發上品殷重之心領納如來清淨妙戒鳴尺一下今正為汝等白四羯磨受大比丘戒汝等當眼觀壇儀耳聽羯磨一心諦受莫餘思餘覺羯磨師先作一白疊事告知次秉三羯磨量其可否此古壇廣文於鳴尺下補其一二準十誦云羯磨受戒時當一心聽莫餘覺餘思唯應敬重當正思惟心心相憶念應分別之違者突吉罪若受戒壇數衆多可用隨機羯磨中略文此廣略之文皆出自南山如略開導時應與彼言六道衆生多是戒障唯人得受猶含遮難不必並堪汝無遮難定得受戒汝當依論文發增上心所謂救攝一切衆生以法度彼又戒是諸善根本能作三乘正因又戒是佛法中寶餘道所無又能護持佛正法久住又仗羯磨威勢衆僧大力能舉法界勝法置汝身心汝當眼觀壇儀耳聽羯磨云云如前廣中可知第十二正受戒體法羯磨師合掌云惟願和尚大衆不吝慈悲布施其戒同心共秉慎勿異緣令此三人感發圓宗戒體將秉羯磨聽宣作白大德僧聽此某甲等從和尚某甲求受具足戒此某甲等今從衆僧乞受具足戒某甲為和尚某甲等自説清淨無諸難事年滿二十三衣鉢具若僧到時僧忍聽僧授某甲等具足戒某甲為和尚白如是作白成否七證師合掌齊答云成大德僧聽此某甲等從和尚某甲求受具足戒此某甲等今從衆僧乞受具足戒某甲為和尚某甲等自説清淨無諸難事年滿二十三衣鉢具僧今授某甲等具足戒某甲為和尚誰諸長老忍僧與某甲等授具足戒某甲為和尚者默然誰不忍者説此是初羯磨成否如前答成大德僧聽此某甲等從和尚某甲求受具足戒此某甲等今從衆僧乞受具足戒某甲為和尚某甲等自説清淨無諸難事年滿二十三衣鉢具僧今授某甲等具足戒某甲為和尚誰諸長老忍僧與某甲等授具足戒某甲為和尚者默然誰不忍者説此是二羯磨成不如前答成大德僧聽此某甲等從和尚某甲求受具足戒此某甲等今從衆僧乞受具足戒某甲為和尚某甲等自説清淨無諸難事年滿二十三衣鉢具僧今授某甲等具足戒某甲為和尚誰諸長老忍僧與某甲等授具足戒某甲為和尚者默然誰不忍者説此是三羯磨成不如前答成僧已忍與某甲等授具足戒竟某甲為和尚僧忍默然故是事如是持善見論及諸律並云受具足已和尚阿闍黎等為當記春夏冬時分某月某日乃至量影等時受具足戒若不為説記取者壇上師有罪此明僧臘夏數令行來坐起知上中下座尊卑禮節故第十三次説四墮法時有比丘受具足已衆僧捨去既不識犯便造重罪佛言自今已去作羯磨已當先與四波羅夷法和尚戒師撫尺云善男子聽如來至真等正覺説四波羅夷法若比丘犯一一法非沙門非釋子汝一切不得犯淫作不淨行若比丘犯不淨行受淫欲法乃至共畜生非沙門非釋子爾時世尊與説譬喻猶如有人截其頭終不能還活比丘亦如是犯波羅夷法已不能還成比丘行汝是中盡形壽不得作能持否答能持一切不得盜下至草葉若比丘盜人五錢若過五錢若自取教人取若自破教人破若自斫教人斫若自燒教人燒若埋若壞色者彼非沙門非釋子譬如斷多羅樹心終不復更生長比丘犯波羅夷法亦如是終不更成比丘行汝是中盡形壽不得作能持否答能持一切不得故斷衆生命下至蟻子若比丘故自手斷人命持刀與人教死歎死與人非藥若墮胎若厭禱殺自作方便若教人作非沙門非釋子譬喻者説言猶如針鼻缺不堪復用比丘亦如是犯波羅夷法不復成比丘行汝是中盡形壽不得作能持否答能持一切不得妄語乃至戲笑戲笑謂學口頭禪演習機鋒轉語也若比丘非真實非己有自説言我得上人法得禪得解脫得定得四空定得須陀洹果斯陀含果阿那含果阿羅漢果天龍來鬼神來供養我彼非沙門非釋子譬喻者譬如大石破為二分終不可還合比丘亦如是犯波羅夷法不可還成比丘行汝是中盡形壽不得作能持否答能持比丘有二百五十戒相唯此四法謂之根本無殘罪若犯不聽懺即當滅擯故先急急宣説餘者謂之枝葉有殘罪若犯許懺是以稍緩待下壇去令其讀學故今不宣第十四後授四依法時世飢儉乞求難得有外道輒自出家受戒後僧無食便即休道佛言先與四依然後受戒復有外道求僧出家先説四依彼即報言我堪二依若納衣腐藥不堪此二即便休道佛言此外道大有所失自今已去後授四依應如是授和尚撫尺云善男子聽如來至真等正覺説四依法比丘依此得出家受具足戒成比丘法比丘依糞掃衣依此得出家受具足戒成比丘法是中盡形壽能持否答能持若得長利檀越施衣割壞衣得受先制止後開聽下同比丘依乞食比丘依此得出家受具足戒成比丘法是中盡形壽能持否答能持若得長利若僧差食檀越送食月八日食十五日食月初一日食若僧常食檀越請食得受比丘依樹下坐比丘依此得出家受具足戒成比丘法是中盡形壽能持否答能持若得長利若別房尖頭屋小房石室兩房一戶得受比丘依腐爛藥比丘依此得出家受具足戒成比丘法是中盡形壽能持否答能持若得長利酥油生酥蜜石蜜得受今所宣第四依法是西域醫藥此方乃草根木皮等雖然律從西制而教已流東必隨土地所産時醫所用凡是比丘應病之藥有餘棄者皆名腐爛藥但是檀越發心布施一切藥餌皆名長利若不隨其方國者則此依法徒受而無益矣第十五結勸回向和尚撫尺云汝受戒已白四羯磨如法成就得處所和尚如法阿闍黎如法衆僧具足滿汝當善受教法應當勸化作福治塔供養佛法衆僧和尚阿闍黎若一切如法教不得違逆應學問誦經勤求方便於佛法中得須陀洹果斯陀含果阿那含果阿羅漢果汝始發心出家功不唐捐果報不絶餘所未知當問和尚阿闍黎汝等作禮下壇此文出本律中若壇數多三人受竟下壇令上殿禮佛發願堅持戒品其為教授師者唯在壇上滿足十師之數聽秉宣白四羯磨應成已彼沙彌等即得具足戒師復下壇往屏處問第二壇沙彌難問畢亦如前白召入衆壇壇皆然若正白四羯磨時壇上十師不滿縱羯磨成彼沙彌等亦不得具足戒乃至最後一壇受竟時引禮呼前受戒者同集壇前左右列班俟最後受者下壇和尚鳴尺十師齊起座而立和尚叉手回向云以此受具功德願戒海澄清蕩衆生之業垢僧田淨潔作大地之津梁四恩三有均沾利益大衆同音念佛回向壇下大衆齊聲念佛壇上九師轉向和尚作禮三拜兩立引禮呼新比丘等一齊向上頂禮三拜起立分班第十師先行乃至和尚在末從南下第二級順西南繞至東下第三級各著履繞詣壇前齊列作禮三拜維那舉回向偈大衆同和受戒功德殊勝行無邊勝福皆回向普願沈溺諸有情速往無量光佛剎十方三世一切佛諸尊菩薩摩訶薩摩訶般若波羅蜜十師禮畢回向偈終和尚轉面南立九師兩分二引禮雙鳴引磬相對前行新比丘等左右次序隨後至方丈前兩行合掌面面對跪候十師行過仍起雙行至座前列班頂禮十師已徐徐雁行各歸本堂俟衆引禮及諸引贊回如常禮謝之然後九師轉下禮辭和尚而退佛言當令受具戒者在前而去弟子當日三時問訊和尚朝中日暮當為和尚執作二事勞苦不得辭説一者修理房舍二者補浣衣服和尚一切如法教盡當奉行違者如法治二壇傳戒正範三壇傳授菩薩戒正範梵網經第二十三憍慢僻説戒云佛滅度後欲以好心受菩薩戒時於佛菩薩形像前自誓受戒當七日佛前懺悔得見好相便得戒若不得好相時應三七乃至一年要見好相若不得好相雖佛像前受戒不得戒若現前先受菩薩戒法師前受戒時不須要見好相何以故是法師師師相授故不須好相是以法師前受戒即得戒以生至重心故便得戒若千里內無能授戒師得佛菩薩形像前自誓受戒要見好相菩薩瓔珞本業經大衆受學品云佛子受戒有三種受一者諸佛菩薩現在前受得真實上品戒二者諸佛菩薩滅度後千里內有先受戒菩薩者請為法師教授其弟子得正法戒是中品戒三者諸佛菩薩滅度後千里內無法師之時應在諸佛菩薩形像前自誓受戒是下品戒其梵網大部一百一十二卷六十一品全文未傳此方唯第十心地品流通奉持故缺師前授法菩薩瓔珞本業經及彌勒菩薩所説菩薩戒羯磨文中俱明故今會合加儀遵行有據第一明敷座結壇法若受戒日先於佛殿若衆多於佛殿前丹墀中亦可懸以幡蓋正中敷一高座供得戒本師釋迦牟尼佛位左上敷一高座供尊證師十方諸佛羯磨師文殊菩薩教授師彌勒菩薩同學等侶十方菩薩位右上敷一高座候所請菩薩戒法師一一座筵皆設香花時至鳴楗椎諸引禮令受戒者各各挂鉢執具身著三衣將詣殿內或往丹墀彼受戒者向引禮師三拜分班而立引禮白云諸佛子今為汝等嚴淨道場敷設法座秉受菩薩妙善戒法汝等先當隨我誦呪結壇次方入室請師引禮白已於正中向座合掌問訊已轉身順右舉大悲呪彼受戒等一齊朗誦各各依次貫珠隨後而行旋繞三匝三誦呪畢引禮先歸本位隨者亦各照班次立定舉南無甘露王菩薩摩訶薩三聲第二明請師入壇法凡在界內同居大僧先聽鳴椎齊集方丈結壇既畢諸引禮左右相對導前出壇衆求戒者一一次第對隨於後俱詣方丈如常列班二引禮各將二求戒者往請二阿闍黎到已求戒等作禮三拜二阿闍黎分歸輔弼位而立四引禮出班先應通知侍者次入室請師師出室就座二阿闍黎轉向菩薩戒法師三拜復位引禮云諸佛子等一齊向上排班聞磬聲至誠頂禮三拜撩衣護鉢拜已長跪合掌夫菩薩戒者事出非常憑師乃發佛前自誓相好難期一遇明師便名得戒今為汝等恭請某堂上某律師為汝等作菩薩戒法師請師之語汝合自陳恐汝未能我今教汝各稱法名稱已其餘言詞皆隨我道菩薩戒羯磨經云若諸菩薩欲學菩薩三聚淨戒或是在家或是出家於無上菩提發弘願已審求功德具足有智有力同法菩薩先禮雙足偏袒右肩膝輪據地合掌恭敬如是請言大德憶念我某甲今於大德所乞受一切菩薩淨戒惟願須臾不辭勞倦哀愍聽授此請詞出彌勒羯磨經如是三請三叩首菩薩戒法師云諸佛子等汝既殷勤伸請我今可爾臨壇遵依大乘經律為秉宣授受引禮云諸佛子等一齊起立聞磬聲頂禮三拜撩衣護鉢拜已起具分班待衆起立已定引禮將香與一為首者執之菩薩戒法師起座合掌舉南無本師釋迦牟尼佛大衆齊稱佛號壇中大擂法鼓二引禮左右相對導持幢幡者前行次隨喜衆次受戒者次二引禮雙鳴引磬其執香者逐後二阿闍黎又次之菩薩法師在末二侍者一捧鉢一持錫杖相隨其引導幢幡進壇詣上左右高座旁立隨喜大衆依隨幢幡從上次第兩序而下排定受戒者如常班次對列其鳴磬二引禮兩分却至幡前二阿闍黎於中高座前左右對立法師居中展大具作觀頂禮十方三世三寶九拜鉢杖隨立其後維那舉集衆偈云降伏魔力冤除結盡無餘聞此妙響音盡當雲來集南無雲來集菩薩摩訶薩三稱鐘聲傳三千界內佛法揚萬億國中功勳酬帝主深恩利益報檀那厚德今為傳授菩薩三聚淨戒説者九拜竟舉偈畢法師起具升座拈香斂衣而坐二阿闍黎轉下亦如是九禮已詣法師高座上於左右輔立鉢杖持在師後引禮云隨喜海衆出班禮佛大衆具儀詣中三禮竟各各依次仍歸本位列之引禮云上香執香者徐徐轉中向上一舉順右進至佛前長跪上香已復位諸佛子一齊向上排班展大具聞磬聲頂禮三拜撩衣護鉢拜已長跪合掌第三明禮敬三寶法菩薩羯磨經云既作如是無倒請已偏袒右肩恭敬禮拜供養十方三世諸佛世尊已入大地得大智慧得大神通諸菩薩衆現前專念彼諸功德生殷淨心又瓔珞經云善男子善女人當受戒時先禮過去世盡過去際一切佛禮未來世盡未來際一切佛禮現在世盡現在際一切佛如是三禮法僧亦然引禮云諸佛子汝等既發勝心求受菩薩淨戒應當作觀運心隨我音聲頂禮十方三寶人各自稱法名稱已一齊起立合掌左右引禮或八人或六或四對往至中一行列定展大具入觀頂禮合掌作梵云一心頂禮過去世盡過去際一切諸佛諸受戒者必須同聲同禮一切恭謹勿致身口參差心意散亂一心頂禮未來世盡未來際一切諸佛一心頂禮現在世盡現在際一切諸佛一心頂禮過去世盡過去際一切尊法一心頂禮未來世盡未來際一切尊法一心頂禮現在世盡現在際一切尊法一心頂禮過去世盡過去際一切賢聖一心頂禮未來世盡未來際一切賢聖一心頂禮現在世盡現在際一切賢聖第四明正請師法羯磨經云其受戒菩薩復於有智有力菩薩所謙下恭敬膝輪據地對佛像合掌請言即下請詞是也是故禮三寶竟諸求戒者仍各長跪合掌衆引禮起具復位唯一引禮立於佛前教云諸佛子等今對佛像前隨我語言至誠正請菩薩戒法師惟願大德哀愍授我某甲等菩薩淨戒作是一説已衆齊一叩首引禮復還本位菩薩羯磨經云如是請已專念一境長養淨心我今不久當得無盡無量無上大功德藏即隨思惟如是事義默然而住爾時菩薩戒法師應撫尺問云諸佛子聽汝是菩薩否衆齊答云是菩薩師復云既是菩薩汝發菩提心未答云已發菩提心第五明開導戒法菩薩戒師撫尺云諸佛子聽汝等今者欲於我所受諸菩薩一切學處受諸菩薩一切淨戒謂攝律儀戒十波羅夷即止惡也攝善戒法八萬四千法門即行善也饒益有情戒慈悲喜捨即度生也如是學處如是淨戒過去一切菩薩已具未來一切菩薩當具普於十方現在一切菩薩今具如是學處如是淨戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學汝能受否衆答云能受如是三問三答此文出羯磨經中第六明請聖法菩薩戒法師撫尺云汝諸佛子既能受菩薩淨戒能學菩薩學處者各各起立合掌端秉一心五體投地隨我伸請諸佛菩薩為菩薩戒和尚諸師各稱自己法名稱已師起座拈香入觀作梵二阿闍黎同音請云香花迎香花請比丘某甲等一心奉請有餘衆隨加名大德釋迦如來一心念我比丘某甲等今請如來為我作得戒和尚惟願如來為我作得戒和尚我依如來故得受菩薩三聚十無盡清淨戒慈愍故當三啓請三頂禮下皆同香花迎香花請比丘某甲等一心奉請加名同前大德文殊師利菩薩一心念我某甲等今請菩薩為我作羯磨阿闍黎惟願菩薩為我作羯磨阿闍黎我依菩薩故得受菩薩三聚十無盡清淨戒慈愍故香花迎香花請比丘某甲等一心奉請加名同前大德彌勒菩薩一心念我某甲等今請菩薩為我作教授阿闍黎惟願菩薩為我作教授阿闍黎我依菩薩故得受菩薩三聚十無盡清淨戒慈愍故香花迎香花請比丘某甲等一心奉請加名同前大德十方一切如來一心念我某甲等今請如來為我作尊證師惟願如來為我作尊證師我依如來故得受菩薩三聚十無盡清淨戒慈愍故香花迎香花請比丘某甲等一心奉請加名同前大德十方一切菩薩摩訶薩一心念我某甲等今請菩薩為我作同學等侶惟願菩薩為我作同學等侶我依菩薩故得受菩薩三聚十無盡清淨戒慈愍故如是拈香一一三請已畢師復就座而坐引禮呼衆長跪合掌第七受四不壞信菩薩戒師撫尺云瓔珞經云禮三寶已復教受四不壞信依止四依所云四不壞信者蓋吾人所稟體性是一而於此一體之中具得有佛法僧寶及戒故梵語佛陀華言覺謂性體靈覺照了諸法非空非有是名本具之佛寶也法即軌持之義謂法性寂滅而恆沙性德皆可軌持是名本具之法寶也僧者梵語具云僧伽華言和合衆謂恆沙妙德性相不二理事和合是名本具之僧寶也戒者謂金剛光明寶戒是一切佛本源一切菩薩本源一切衆生佛性種子是名本具之性戒也汝等從今信得自心是佛是法是僧是戒盡未來際身不忘不失故云四不壞信雖云體具真常不無修證所謂是心作佛是心是佛應當歸投住持三寶納受清淨妙戒依止修行方得圓成無上佛果今對諸佛菩薩座前一一諦受歸依之語汝當自説恐汝不能隨我所道我某甲從今時盡未來際身歸依佛我某甲從今時盡未來際身歸依法我某甲從今時盡未來際身歸依僧我某甲從今時盡未來際身歸依戒各隨師語朗説三受三叩首第八懺悔過法菩薩戒師撫尺云諸佛子梵網經所明現身有犯七逆者不得受戒前夜羯磨師已曾一一詳審汝等幸皆無犯故得受戒今準瓔珞經云受四不壞信已次當教悔三世罪而罪所言三世者謂過去無明種子為罪業之因今生現行為罪業之緣繇此現行熏過去無始以來之業種因緣和合而所作業成又為當來罪業之惡因如是展轉相資故令輪回不絶今憑諸佛菩薩座前慚愧悔過若能違今生之現行則過去業種乾枯未來業因自滅悔過之言汝合自説恐汝不能隨我所道我某甲若過去身口意十惡罪願畢竟不起盡未來際我某甲若現在身口意十惡罪願畢竟不起盡未來際我某甲若未來身口意十惡罪願畢竟不起盡未來際各隨師語朗説三悔三叩首第九明發願法瓔珞及羯磨二經缺發願今采時行戒本內發十四願以補之菩薩戒師撫尺云諸佛子等悔過已竟三業清淨如淨琉璃內外明照次應發十四種大願依而修行圓滿功德假使熱鐵輪在於頂上旋終不以此苦退失所發願我今對諸佛菩薩座前一一為汝等三宣汝等當向諸佛菩薩座前心念口言一一自説各稱法名稱已鳴尺一下第一汝等從今時盡未來際身常能念佛親近善知識否答云能親近第二汝等從今時盡未來際身常能捨離諸惡知識否答云能捨離第三汝等從今時盡未來際身乃至失命因緣不犯戒否答云不犯第四汝等從今時盡未來際身常能讀誦大乘經律問甚深義否答云能問第五汝等從今時盡未來際身常能於無上菩提生信心否答云能生第六汝等從今時盡未來際身若見衆生苦惱時能救護否答云能救護第七汝等從今時盡未來際身常能隨力供養三寶否答云能供養第八汝等從今時盡未來際身常能孝順父母敬事師長否答云能孝敬第九汝等從今時盡未來際身常能捨諸懈怠勤求佛道否答云能勤求第十汝等從今時盡未來際身於五塵上諸煩惱生時能制伏心否答云能制伏第十一汝等從今時盡未來際身衆生無邊誓願度汝能度否答云能度第十二汝等從今時盡未來際身煩惱無盡誓願斷汝能斷否答云能斷第十三汝等從今時盡未來際身法門無量誓願學汝能學否答云能學第十四汝等從今時盡未來際身佛道無上誓願成汝能成否答云能成第十明發戒體法菩薩戒師撫尺云諸佛子等既能發此十四種深宏誓願我當起座為汝等頂禮啓白十方現住諸佛及諸菩薩感發汝等圓宗戒體汝應一心善聽作意諦思當知我初番白竟之時十方世界妙善戒法繇心業力悉皆震動我二番白竟之時十方世界妙善戒法如雲如蓋覆汝頂上我三番白竟之時十方世界妙善戒法從汝頂門流入身心充滿正報盡未來際永為佛種此是無作戒體無漏色法繇汝增上善心之所感得是故汝應至誠頂受次正授戒體法經云能受菩薩不起於座如故長跪能授菩薩起座對佛像前普於十方現住諸佛及諸菩薩恭敬供養頂禮雙足作白即下白文今準義加儀則二阿闍黎下座先行菩薩戒師在後至佛像座前二師分立左右戒師居中拈香入觀三頂禮長跪合掌白云仰啓十方無邊無際諸世界中諸佛菩薩今於某省某寺此中現有某甲菩薩於我某甲菩薩所乃至三説受菩薩戒我為作證惟願十方無邊無際諸世界中諸佛菩薩第一真聖於現不現一切時處一切有情皆現覺者於某甲受戒菩薩亦為作證慈愍故慈愍故大慈愍故此準經文如是三白謂之三番羯磨羯磨如法成已受者即得戒戒師與二師禮卻本座非似僧法受具十師俱坐羯磨應成而已第十一明宣戒相法上依菩薩羯磨經文三番啓白聖已即得菩薩三聚妙善戒體此依梵網經中次宣菩薩十重四十八輕戒相而俾識相守持以護體故菩薩戒師撫尺云諸佛子菩薩有十無盡戒應受持各稱法名稱已言十無盡戒者瓔珞經云一切菩薩凡聖戒盡心為體是故心亦盡戒亦盡心無盡故戒亦不盡故言無盡戒也佛子從今身至佛身盡未來際於其中間第一不得故殺生若有犯非菩薩行失四十二賢聖法不殺戒能持否答云能持佛子從今身至佛身盡未來際於其中間第二不得故偷盜若有犯非菩薩行失四十二賢聖法不盜戒能持否答云能持佛子從今身至佛身盡未來際於其中間第三不得故淫欲若有犯非菩薩行失四十二賢聖法不淫戒能持否答云能持佛子從今身至佛身盡未來際於其中間第四不得故妄語若有犯非菩薩行失四十二賢聖法不妄語戒能持否答云能持佛子從今身至佛身盡未來際於其中間第五不得故酤酒若有犯非菩薩行失四十二賢聖法不酤酒戒能持否答云能持佛子從今身至佛身盡未來際於其中間第六不得故説在家出家菩薩比丘比丘尼罪過若有犯非菩薩行失四十二賢聖法不説四種過戒能持否答云能持佛子從今身至佛身盡未來際於其中間第七不得故自讚毀他若有犯非菩薩行失四十二賢聖法不自讚毀他戒能持否答云能持佛子從今身至佛身盡未來際於其中間第八不得故慳惜加毀若有犯非菩薩行失四十二賢聖法不慳惜加毀戒能持否答云能持佛子從今身至佛身盡未來際於其中間第九不得故瞋心不受悔若有犯非菩薩行失四十二賢聖法不瞋心不受悔戒能持否答云能持佛子從今身至佛身盡未來際於其中間第十不得故謗三寶若有犯非菩薩行失四十二賢聖法不謗三寶戒能持否答云能持諸佛子已説十波羅提木叉竟四十八輕今當説撫尺云佛子從今身至佛身盡未來際其中間第一不得故不敬師友若有犯非菩薩行不敬師友戒能持否答云能持第二不得故飲酒若有犯非菩薩行不飲酒戒能持否答云能持第三不得故食肉若有犯非菩薩行不食肉戒能持否答云能持第四不得故食五辛若有犯非菩薩行不食五辛戒能持否答云能持第五不得故不教悔罪若有犯非菩薩行不教悔罪戒能持否答云能持第六不得故不供給請法若有犯非菩薩行不供給請法戒能持否答云能持第七不得故懈怠不聽法若有犯非菩薩行懈怠不聽法戒能持否答云能持第八不得故背大向小若有犯非菩薩行不背大向小戒能持否答云能持第九不得故不看病若有犯非菩薩行不看病戒能持否答云能持第十不得故畜殺具若有犯非菩薩行不畜殺具戒能持否答云能持第十一不得故作國使若有犯非菩薩行不作國使戒能持否答云能持第十二不得故販賣若有犯非菩薩行不販賣戒能持否答云能持第十三不得故謗毀若有犯非菩薩行不謗毀戒能持否答云能持第十四不得故放火焚燒若有犯非菩薩行不放火焚燒戒能持否答云能持第十五不得故僻教若有犯非菩薩行不僻教戒能持否答云能持第十六不得故為利倒説若有犯非菩薩行不為利倒説戒能持否答云能持第十七不得故恃勢乞求若有犯非菩薩行不恃勢乞求戒能持否答云能持第十八不得故無解作師若有犯非菩薩行不無解作師戒能持否答云能持第十九不得故兩舌若有犯非菩薩行不兩舌戒能持否答云能持第二十不得故不行放救若有犯非菩薩行不行放救戒能持否答云能持第二十一不得故瞋打報仇若有犯非菩薩行不瞋打報仇戒能持否答云能持第二十二不得故憍慢不請法若有犯非菩薩行不憍慢不請法戒能持否答云能持第二十三不得故憍慢僻説若有犯非菩薩行不憍慢僻説戒能持否答云能持第二十四不得故不習學佛若有犯非菩薩行不習學佛戒能持否答云能持第二十五不得故不善知衆若有犯非菩薩行不善知衆戒能持否答云能持第二十六不得故獨受利養若有犯非菩薩行不獨受利養戒能持否答云能持第二十七不得故受別請若有犯非菩薩行不受別請戒能持否答云能持第二十八不得故別請僧若有犯非菩薩行不別請僧戒能持否答云能持第二十九不得故邪命自活若有犯非菩薩行不邪命自活戒能持否答云能持第三十不得故不敬好時若有犯非菩薩行不敬好時戒能持否答云能持第三十一不得故不行救贖若有犯非菩薩行不行救贖戒能持否答云能持第三十二不得故損害衆生若有犯非菩薩行不損害衆生戒能持否答云能持第三十三不得故邪業覺觀若有犯非菩薩行不邪業覺觀戒能持否答云能持第三十四不得故暫念小乘若有犯非菩薩行不暫念小乘戒能持否答云能持第三十五不得故不發願若有犯非菩薩行不發願戒能持否答云能持第三十六不得故不發誓若有犯非菩薩行不發誓戒能持否答云能持第三十七不得故冒難遊行若有犯非菩薩行不冒難遊行戒能持否答云能持第三十八不得故乖尊卑次序若有犯非菩薩行不乖尊卑次序戒能持否答云能持第三十九不得故不修福慧若有犯非菩薩行不修福慧戒能持否答云能持第四十不得故揀擇授戒若有犯非菩薩行不揀擇授戒戒能持否答云能持第四十一不得故為利作師若有犯非菩薩行不為利作師戒能持否答云能持第四十二不得故為惡人説戒若有犯非菩薩行不為惡人説戒戒能持否答云能持第四十三不得故無慚受施若有犯非菩薩行不無慚受施戒能持否答云能持第四十四不得故不供養經典若有犯非菩薩行不供養經典戒能持否答云能持第四十五不得故不化衆生若有犯非菩薩行不化衆生戒能持否答云能持第四十六不得故説法不如法若有犯非菩薩行不説法不如法戒能持否答云能持第四十七不得故非法制限若有犯非菩薩行不非法制限戒能持否答云能持第四十八不得故破法若有犯非菩薩行不破法戒能持否答云能持第十二結讚回向瓔珞經云佛子受十無盡戒已其受者過度四魔越三界苦從生至生不失此戒常隨行人乃至成佛又經云受菩薩戒者即於此身一念之中具足八種殊勝功德一者趣道場殊勝譬如大鵬一飛過十萬里菩薩發心受此大戒越六趣三乘直至菩提故二者發心殊勝若人一念發起大悲大智受菩薩戒即超二乘如昔有沙彌侍一羅漢而行忽發菩提心求受菩薩戒此阿羅漢返生恭敬為擔衣鉢讓路而行三者福田殊勝假使有人供養滿閻浮提大阿羅漢不如供一受菩薩戒者以彼運心廣大故四者功力殊勝受小乘戒譬如螢火受菩薩戒譬如日光一切普照故五者滅罪殊勝受戒破犯猶勝外道以戒威力設墮惡道受罪輕微故六者受胎殊勝受菩薩戒者若在胞胎常為天龍善神共守護故七者神通殊勝受菩薩戒者能攪長河為酥酪變大地作黃金一念中超越千生一日內廣度羣品故八者果報殊勝受菩薩戒者當生蓮華藏海受法性身一得真常永不退轉故諸佛子等汝今既受菩薩戒已即獲如是殊勝功德各各善護守持於行住坐臥日夜六時讀誦是戒猶如金剛如帶持浮囊欲渡大海如草繫比丘常生大乘善信自知我是未成之佛諸佛是已成之佛發菩提心念念不去心若起一念二乘心者即非菩薩是故應當珍敬慎勿懈退如是結勸畢鳴尺一下衆一叩首菩薩戒師起座合掌回向云以此受戒功德上報四恩下濟諸苦法界衆生同圓種智在會沙門共證菩提海衆齊音念佛回向大衆同聲念佛引禮呼新菩薩三拜起具分班二阿闍黎先下座至中禮佛三拜近佛座左右而立菩薩戒師下座禮佛三拜維那舉回向偈衆和之受戒功德殊勝行無邊勝福皆回向普願沈溺諸有情速往無邊光佛剎回向因緣三世佛文殊普賢觀自在諸尊菩薩摩訶薩摩訶般若波羅蜜其送菩薩戒師歸方丈謝二師及諸引禮一一皆同受具之儀今大乘戒七衆同收若有比丘尼式叉摩那沙彌沙彌尼優婆塞優婆夷者俱隨送之但要各歸各衆不得糅亂雖理性戒體無二然事相世儀須分能善護譏嫌即名持戒也若授在家菩薩優婆塞六重二十八輕戒者科儀同此唯異戒相故附之先六重戒相第一不殺生是優婆塞菩薩戒若有犯非菩薩行不殺生戒能持否答能持第二不偷盜如前第三虗説如前第四邪淫如前第五宣説四衆過罪如前第六酤酒如前二十八輕戒相第一不能供養父母師長是優婆塞菩薩戒若有犯非菩薩行不供養父母師長戒能持否答能持第二耽樂飲酒如前第三惡心不能瞻視病苦如前第四有乞者不能多少分與遣空還如前第五見四衆不能承迎禮拜問訊如前第六見四衆毀所受戒心生憍慢如前第七月六齋日不受八戒供三寶如前第八四十里中有講法處不能往聽如前第九受招提僧臥具牀坐如前第十疑水有蟲故便飲之如前十一險難之處無伴獨行如前十二獨宿尼寺如前十三為於財命打罵奴婢僮僕外人如前十四以飱食施四衆如前十五畜貓狸如前十六畜養象馬牛羊駝驢一切畜類如前十七不儲畜僧伽黎衣鉢錫杖如前十八若須田作不求淨水及陸種處如前十九物説價已捨賤趨貴斗稱量物不令平用如前二十於非處非時行欲如前二十一隱瞞官稅如前二十二犯國制如前二十三得新穀果蓏菜茹不先供奉三寶先自受如前二十四僧若不聽説法讚歎輒自作如前二十五道路若在比丘沙彌前行如前二十六僧中付食若偏為師選擇美好過分與如前二十七養蠶如前二十八路遇病者不能瞻視為作方便付囑所在如前覺源禪師與本師借庵老和尚論傳戒書覺源禪師與本師借庵老和尚論傳戒書傳戒之書律中名為授戒羯磨東土宣律師以後自華山傳戒正範一出而天下奉為司南名曰律主是誠足以莊嚴佛樹矣但仔細檢點其中有不貫串者凡有數則一曰發菩提心不貫串二曰懺摩不貫串三曰問遮難不貫串四曰白四羯磨不貫串司羯磨者可以離此用亦可以即此用也何謂發菩提心不貫串夫菩提心者具足一切佛法一曰直心正念真如法是二曰深心具足十波羅蜜是三曰回向心以諸佛大願回向三處是三賢分證此三心十地合證此三心等覺此三心等有妙覺圓滿此三心藏中有授菩提心戒一卷受此一戒則可以具足一切戒矣今不預受此戒先教以懺摩至授菩薩戒時但問之以已發菩提心未答曰已發授者受者皆不知菩提心為何物但含糊問答而已華嚴經云忘失菩提心修諸善法是為魔事為今之計司羯磨者當發露時先教之以向十方佛前發四宏誓願司教授者於過毗尼時教之以華嚴淨行品向文殊前發一百四十大願一願一拜然後至問已發菩提心時便可胸中了了不至突如其來矣何謂懺摩不貫串夫懺摩者名為發露改往修來決定毗尼經中世尊教以發露之法曰五無間曰十不善曰盜用僧物曰覆藏又教以回向稱禮三十五佛洪名不多不寡此可為式乃惟專稱本師釋迦一佛雖亦可以減罪而發露不周其與覆藏有何異乎何謂問遮難不貫串律中以一人一壇為正至多不得過三人今必決定三人一壇是畏煩而徒苟簡矣今此衣鉢是汝自己有否答之以是言是自己有非借來也今改之以有是明開其借衣鉢矣後問衣鉢具足否答以具足恐其不具與前是字分明兩事若前改為有字無論文義不對而前有後具不又重疊乎何謂羯磨不貫串夫四分羯磨與隨機羯磨雖俱係律藏但僧祇是佛本意見於舍利弗問經餘部為被添之甘露佛已有明訓矣今傳戒白四羯磨主於四分是不具擇法眼也何則佛法以默然為印證處處皆然今白四羯磨中添入四個成否齊答四個成字則是僧竟不默然矣毋論不是佛法即後結處默然故句前後乃自相違矣惟靈峯大師毗尼事義集要中不用四個成字真是鵝王擇乳手段此係得戒緊要事故不可不辨更有甚者律係佛制如王法不可增減今傳戒正範中摘去求授人具足羯磨一條直是減損律制如周室班爵之制諸侯惡其害已而皆去其籍傳戒之摘去此一羯磨何以異於戰國之諸侯壞周制乎幸古本尚在猶有可考凡司傳戒者用其法去其弊斯可傳佛心印幸毋效其尤也
