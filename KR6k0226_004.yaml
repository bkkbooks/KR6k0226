body:
  text: 金陵寶華山司律沙門讀體撰初壇傳授沙彌戒正範初令淨人灑掃法堂正敷一座左右設二輔弼座列供香花然燭至時鳴椎集衆諸引禮統新求戒者各持五七二衣挂鉢執具詣堂以所持之衣置於旁案向引禮師三拜二引禮各將二人往請二師到已齊禮三拜次同二師迎請和尚但以九人一人執香禮儀如常迎至法堂維那作梵舉集衆偈若求戒者鮮或遇餘緣則不必局於偈單舉雲來集菩薩三聲亦可和尚升座拈香復舉香讚二師向和尚具儀三禮起已歸本位而立待衆三請已畢方就位坐引禮云上香復位諸善男子一齊向上排班聞磬聲至誠頂禮三拜拜已長跪合掌第一明請師引禮合掌白云夫鍊金鑄物而像生元因範正為人行已而有禮皆為師嚴若不令起殷重心安能感發增上戒必須明匠以決愚情今為汝恭請某堂上某律師為汝等作沙彌十戒和尚請師之語汝合自陳恐汝未能我今教汝各稱自己法名稱已其餘言詞皆隨我道第二正請師引禮作梵云大德一心念我某甲等今請大德為沙彌十戒和尚願大德為我作沙彌十戒和尚我依大德故得受沙彌戒慈愍故如是三請三叩首為正若三請已總一叩首亦可和尚云善男子汝等既已殷勤三請我為沙彌十戒和尚汝等當依教修行謹慎莫放逸衆答依教奉行引禮云汝等一齊起立聞磬聲至誠頂禮三拜拜已長跪合掌今為汝等恭請現前二師作沙彌十戒阿闍黎請師之語汝合自陳恐汝未能我今教汝各稱自己法名稱已其餘言詞皆隨我道大德一心念我某甲等今請大德為十戒阿闍黎願大德為我作十戒阿闍黎我依大德故得受沙彌戒慈愍故如前拜已師云諸善男子汝等既已殷勤伸請我今可爾為汝等作十戒阿闍黎精進莫放逸答云依教奉行引禮云汝等一齊起立聞磬聲作禮三拜拜已長跪合掌第三開導和尚撫尺云善男子等我今受汝所請為沙彌十戒和尚所有言教各須諦聽夫涅槃經云居家迫窄猶如牢獄一切煩惱因之而生出家寬廣猶若虗空一切善法繇之增長然雖如是若無淨戒諸善功德皆不得生是故當持淨戒所以道剃髮染衣為相受持禁戒為性故薩婆多論云新受戒人與佛齊等以此推之出家僧尼真是善法之聚汝等既出家已號曰沙彌而沙彌之稱有乎二種一者形同沙彌二者法同沙彌梵語沙彌此云勤䇿謂能勤修衆善䇿進心行故若但剃髮染衣未霑戒品名曰形同沙彌若能受持十戒方號法同沙彌今則將升寶壇受具足大戒理當先受沙彌十戒欲受沙彌清淨十戒者先祈三寶以為依怙之尊次屈萬靈而作鎮嚴之主一齊起立隨我音聲至誠作觀一心啓請各稱法名稱已和尚起座拈香作梵二師引禮同音舉和運想三寶一切恭敬第四明請聖香花迎香花請弟子某甲等一心奉請娑婆教主本師釋迦牟尼佛西方接引阿彌陀佛當來下生彌勒尊佛盡虗空遍法界一切諸佛惟願不違本誓慈光攝照證盟受戒如是請已衆齊一拜復起合掌作觀而立乃至三請三拜後準此香花迎香花請弟子某甲等一心奉請大小二乘毗尼律藏五篇三聚解脫木叉十二分經權實教典離欲真淨甚深法寶謹運一心歸命頂禮如前香花迎香花請弟子某甲等一心奉請觀音勢至文殊普賢清淨海衆諸大菩薩律藏會上優波離尊者西天東土歷代祖師傳南山宗諸大律師中興律祖慧雲馨公大和尚此下再續入座上師之得戒本師和尚諱惟願不違本誓慈光攝照證盟受戒如前香花迎香花請某甲等一心奉請此一請詞但言二字法名不同上請三寶云弟子雖天龍鬼神中不無大菩薩權現在內然今以迹論之不論其本也光明會上寄位諸天梵釋四王天龍八部伽藍土地護戒神王金剛力士幽顯靈祇惟願各乘本誓普降法筵監壇護戒如前如是一一三請竟和尚與二師各就本座而坐引禮呼彼受戒者頂禮一拜仍復長跪合掌一心諦聽第五懺悔和尚撫尺云善男子等適來為汝恭請三寶降臨道場證盟受戒今則三寶光明赫奕在此座筵汝等現身一往所作之業各人已知已憶者於昨夜羯磨堂中曾經懺悔尚有無始至於今生所造微細過愆識情昏迷不自覺知惟有諸佛菩薩盡知盡見汝等應當翹勤五體端秉一心求哀懺悔懺悔之語汝合自陳恐汝未能我今教汝所有言詞隨我所道下偈和尚舉二句引禮教彼説二句每二句一叩首必須言音明了三伸求悔我弟子某甲從於無始以至今生毀壞三寶作一闡提謗大乘經斷學般若弒害父母出佛身血污僧伽藍破他梵行焚毀塔寺盜用僧物起諸邪見撥無因果狎近惡友違背良師自作教他見聞隨喜如是等罪無量無邊故於今日生大慚愧克誠披露求哀懺悔惟願三寶慈悲攝受放淨光明照觸我身諸惡消滅三障蠲除復本心源究竟清淨南無普賢王菩薩摩訶薩三稱此乃廣陳懺悔若時促仍用大經四句慚愧則四句消愆無慚則縱廣無益往昔所造諸惡業皆由無始貪瞋癡一切罪障皆從身語意之所生今對佛前求懺悔一切罪根皆普賢菩薩如上三稱和尚撫尺云諸善男子我今為汝等懺悔已竟阿闍黎當為彼等問其遮難秉歸羯磨第六問難羯磨師撫尺云善男子所言遮難者準律明制更有十三重難十六輕遮遮難若無方是完全淨器堪受比丘大戒此時不及詳問俟圓具登壇時自有教授師於屏處逐一問汝汝等逐一實答若不實答並不得戒我今先且總問汝等以便受沙彌十戒而為比丘具戒之基本也善男子汝等於此現身之中不曾犯重難輕遮否答云無第七歸依羯磨師撫尺云善男子等既無遮難適間對三寶前懺悔已竟戒可得受我今為汝秉宣三歸羯磨令汝等感發戒體當稱自己法名稱已其餘言詞皆隨我道我某甲盡形壽歸依佛盡形壽歸依法盡形壽歸依僧我今隨佛出家某甲為和尚如來至真等正覺是我世尊慈愍故衆隨師語如是三説三叩首第八結歸羯磨師撫尺云上來三歸正是納體於心更加三結得法圓滿謂之三番羯磨汝等再稱法名稱已隨我所道我某甲歸依佛竟歸依法竟歸依僧竟我今隨佛出家已某甲為和尚如來至真等正覺是我世尊慈愍故衆隨師語如是三稱結三叩首第九説戒相和尚撫尺云諸善男子今阿闍黎已為汝等秉宣三歸羯磨竟汝等已得沙彌清淨戒體我今為汝等説十戒之相令汝識相守持以護其體各稱法名稱已第一盡形壽不殺生是沙彌戒汝今能持否答云能持第二盡形壽不偷盜如前第三盡形壽不淫欲如前第四盡形壽不妄語如前第五盡形壽不飲酒如前第六盡形壽不著香花鬘不香油塗身如前第七盡形壽不歌舞倡伎及故往觀聽如前第八盡形壽不坐高廣大牀如前第九盡形壽不非時食如前第十盡形壽不捉持生像金銀寶物如前如是三宣戒相已引禮呼沙彌等一叩首起立兩分教各持呪先搭五衣次著七衣展大具已合掌頂禮三拜若衆多不展具亦可舉南無寶壇華菩薩摩訶薩三稱衆齊同和三拜已仍跪合掌而聽第十聽教囑和尚撫尺云諸沙彌等我已授汝十戒之相竟所有受具法儀出家學本及各門行相威儀自有教授阿闍黎為汝等一一分別今當更示汝等五德十數壯悅道志依而奉行增長智慧成就辨才教化衆生令入佛道所言五德者福田經云一者發心出家懷佩道故二者毀其形好應法服故三者永割親愛無適莫故四者委棄身命遵崇道故五者志求大乘為度人故所言十數者僧祇律云一者一切衆生皆依飲食二者名色三者痛癢想四者四諦五者五陰六者六入七者七覺支八者八正道九者九衆生居十者十一切入此是沙彌之法應如是故既聞知已恆記莫忘當來升寶壇上於諸師座前白四羯磨受大比丘戒入三寶數紹繼聖種自利利他功德難思汝等從茲勤修戒定慧習學經律論使佛法久住世間令衆生正信不斷慎勿懶墮恣縱身心能如是依教奉行否答云依教奉行和尚鳴尺起座叉手回向云以此受戒功德普濟羣生莊嚴淨土大衆同音念佛回向大衆齊聲念佛沙彌等三拜起具分立左右二師下位作禮和尚三拜已和尚下位禮座上佛三拜維那舉回向偈衆接和受戒功德殊勝行無邊勝福皆回向普願沈溺諸有情速往無量光佛剎十方三世一切佛諸尊菩薩摩訶薩摩訶般若波羅蜜初壇傳戒正範二壇傳受比丘戒正範登壇受具者須知兩土發起之端建壇同異之義按要覽云世尊在祇園時比丘樓至請佛立壇為比丘受戒佛敕諸比丘於園外院東南置一戒壇為僧受具公所法敕既頒十六大國諸精藍中咸遵建立自後登壇受具僧界法三一一如制若片乖違則受者不得戒臨壇僧犯罪其言出金口法載龍藏凡聖同軌更無異轍此土肇始南山宣祖於唐高宗麟德二年在淨業寺建石戒壇依律授受時諸律司莫不景仰芳規崇尚而行南山律宗於是大震歷代紹繼蓋有由也今臨安昭慶仙林姑蘇開元等寺古迹猶存又唐寶歷元年及大中二年曾亦廣建方等戒壇宋祥符二年建甘露戒壇七十二處方等者謂廣大平等周遍之稱甘露者取喻涅槃謂戒為入涅槃故從果彰名然戒壇之壇似同比丘所授之戒唯是大乘故壇上正中供佛菩薩五位聖師繞壇之時秉戒和尚並二阿闍黎自下而中自中而上彼三師禮佛菩薩竟從西入佛後復從佛南出敷座於側秉戒和尚坐二阿闍黎左右立其儀迥殊比丘受具十僧數滿難遮重輕大乘不拘根缺緣差但發大心領納即得戒所以壇名方等或云甘露也嗟夫律學廢壇絶登已久今金陵華山如制建壇垂範作持宗紹南山非若倣佛大乘撰儀空談罔實者是故先明戒壇同異冠之於首俾知僧界受具不可無壇有據也其戒壇所在不與大界同體以別是一界故律云時諸比丘有須四比丘衆羯磨事起五比丘衆十人衆二十人衆羯磨事起是中集會疲極佛制聽結戒場毗尼母論云外更不結大界直結小界亦不得受具五分等律亦爾是故凡有比丘如教持戒所在必先結戒場次結大界於戒場內建一戒壇上設十師座無事則以柵欄之作法則乘時而開然此壇乃非師不與之地也正受具日灑掃潔麗於壇周匝懸挂幡蓋瓔珞壇下正中設一香案然燭供花未受具者無容雜聽復於屏處設一問難座第一明僧中請師法律云弟子無師教授故造非法佛言當立和尚弟子看和尚當如父母想敬重瞻視又病比丘無人看顧便不善終佛言當立弟子應共相敬重瞻視便得正法久住增益廣大和尚看弟子當如兒想善見律云以初不請故後便違教佛制令請也十誦及僧祇律云令受戒人先入僧中教使次第一一頭面禮僧足已然後請之毗尼母論云佛言一者和尚如法二者二師如法三者七僧清淨四者羯磨成就五者衆僧和合與欲是名滿足受具也今準諸律會義立儀當於正受具時先鳴楗椎集同界共住比丘僧衆引禮師令求具沙彌各各挂鉢披五七二衣執具捧僧伽黎魚貫而行至法堂已諸引贊大德將彼等手捧之大衣收置左右案上先禮所集界內現前大僧三拜起立分班已次一引禮統二求具者往請七師至堂諸求具者作禮三拜起分兩立次二引禮各率二求具者往請二師至已待九師相會禮畢彼求具等作禮二師三拜起立分班二引禮雙鳴引磬前行領八新求具者詣方丈迎請第一位律師至堂先所請九律師轉下向上作禮三拜十師若是等輩當平拜若九師是第一位之下座或是弟子第一位當納禮毋得紊亂臘次尊𢍉而廢聖制十師作禮竟各就座跏趺已求具沙彌方禮第一位律師引禮云諸沙彌等一齊向上排班展大具聞磬聲至誠頂禮三拜撩衣護鉢拜已長跪合掌左班引禮云夫明鏡當臺遇形則鑑洪鐘在