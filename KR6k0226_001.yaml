body:
  text: 金陵寶華山司律沙門讀體撰初壇授沙彌戒前請戒懺悔儀淨堂集衆第一凡欲作法須先結界若三重界相如法無諸妨礙乃能成辦一切所謂律制僧居必依結界僧弘律制豈越於斯初發心者來入伽藍從僧乞戒應先集僧唱方結界畢次預請和尚允示日期即白引禮師便於淨堂集衆次則通啓二阿闍黎師方可入室禮請結界時新求戒者須驅出至眼見耳不聞處若久行律處所戒場久定不須逐期唱方於授沙彌戒前幾日引禮師命淨人灑掃法堂中敷一座供以香燭至時令淨人鳴楗稚若無淨人沙彌亦可其鳴椎額數依律中僧法各有常準今惟集小衆止許三下餘者如律不復廣明諸求戒者聞聲集已先以四人住引禮師所一觸禮至法堂衆求戒者一齊三拜起立為首者台掌白云我某甲等今者發心志求淨戒但塵情久蔽趨向無繇惟願諸引禮師不倦為人曲垂導引引禮云善哉可爾既汝衆等初入律門儀則未諳今為汝等通啓二師恭詣方丈禮請和尚預為開導伺候臨期升座授汝等沙彌十戒其衆中為首者出班四人隨我分請二師餘者立定衆復齊向引禮師一拜起分左右而立通啓二師第二若準律制授沙彌十戒惟請和尚與夫羯磨阿闍黎無有請教授阿闍黎之説然律制度沙彌授十戒約有三種一者年七歲以至十三歲乃攝驅烏之輩二者年十四歲以至十九歲正當應法之儔三者若年滿二十已上俱屬名字今諸求戒者年既同於名字本意受具為僧故藉沙彌之名位便增進比丘大戒苟非教授威儀莫諳故須並請倘有上二種受沙彌戒者仍遵正制其請二師下堂去來彼此勿相混值以便誡諭初學一引禮將二人往羯磨師寮到已引禮先向師一觸禮起立於左呼彼二人作禮三拜師受請已隨至法堂其請教授師亦爾引禮云諸善男子一齊作禮三拜長跪合掌引禮代為白云彼某甲等欲於來朝求授沙彌十戒今請羯磨師少頃同至方丈啓白和尚大慈曲濟惟願羯磨師俯垂方便允鑒愚忱羯磨師云善男子等信戒之心難發而守持之志倍難汝等既已發心受戒願欲清淨行持皆是夙植善因故今遇此勝會吾當為汝衆等往詣方丈通啓和尚述誠懇請授汝沙彌十戒引禮云一齊起立聞磬聲作禮三拜分班迎請者送羯磨師歸寮復請教授師其儀範如上但白詞中惟改教授二字教授師云善男子信為入道之源戒乃成善之本汝等既能厭俗捨家求受淨戒則源本有據出世功德自然發生必須精勤策勵慎始慎終斯實難遇之良緣皆繇多生之善種吾當為汝等恭詣方丈通啓和尚述誠懇請授汝沙彌十戒作禮亦如是請戒開導第三按薩婆多毗婆沙論云凡欲受戒先與説法引導開解意在䇿發心志欲人識戒旨歸今者但以衣鉢之相而全作戒體授受誠謂執事迷理殊不知要堅持衣鉢之相正顯止作之用果能內嚴戒體染業自然斷除外託衣盂威儀始得安靜然後性相雙具表裏一如庶定慧可期梵行可備故大論云釋子受禁戒是其性剃髮割截衣是其相正此謂也故今於未受沙彌戒前禮請和尚預為開示其正請法儀復在授受之際茲不預述也請和尚則用九人一為首者執香前行引禮鳴引磬統八人隨後二師又在其末至方丈已引禮並請者兩立二師向和尚作禮竟分立左右請者作禮三拜迎和尚至法堂升座二師先禮和尚三拜就位引禮云上香復位一齊向上排班聞磬聲頂禮三拜長跪合掌羯磨師云諸善男子汝等既發信心求受淨戒所有乞戒言辭為首者至誠作白其為首者白云仰白和尚慈悲攝受我弟子某甲等形雖久已出家愧未沾其戒法虗名釋子濫廁僧倫故今匍匐座前願垂哀愍賜我弟子某甲等清淨戒品如法精修奉教行持回向三有下情無任懇禱之至引禮云頂禮一拜和尚撫尺云原夫在家出家就裏本無二致得念失念箇中未動纖毫見聞知覺無非清淨之法身明暗色空總是圓融之妙土斯則人人具足各各皆然既非染淨之殊寧有取舍之相云何於無縛著中更求解脫叵奈衆生迷障識性昏蒙將一真之妙體謬分為物我之軀以不二之覺場妄計為自他之宅緣此綢繆貪愛恣縱瞋癡汩沒塵勞輪回莫絶從迷積迷不思返照以苦入苦永不厭離故一切諸佛出現世間悲愍沈淪拯濟斯類知衆生貪欲多因有家故示之以遠離道而令出家知衆生纏縛皆繇恩愛故示之以解脫道而令捨愛故華嚴經云若有不識出家法樂著生死不求脫是故菩薩捨國財為之出家求寂靜寶積經云無有在家修集無上正覺之道何以故在家貪聚出家捨離在家人我出家平等在家塵垢出家寂靜在家惡攝出家善攝在家沒於愛欲淤泥出家於愛欲淤泥以此則知欲求聖道先須出家故我釋迦世尊中天應迹半夜逾城䇿素馬以淩空詣青山而斷髮雷音既震善來初度於五人法雨才沾羯磨繁興於四海人到於今咸受其賜善男子汝等良因宿植今遇聖恩離欲出家得成僧相而以好心登壇受戒者若不知戒中之義為何是徒有登壇之名而無受戒之實一生虗喪體是白衣故我於未受戒前指示汝等沙彌之戒法戒體戒行戒相四種之義使汝等心得明了受授如法行持有方不乖律制所言戒法者即佛敕舍利弗初度羅睺羅出家所制十支淨戒二十四門儀則及十二年中為無事比丘廣制學處兼制沙彌一切隨律威儀等是也言戒體者即汝等正受戒時以現前第六意識心運想三寶歸竟之時遍緣一切情非情境於此所緣境上發起誓欲防惡誓欲修善之功能是也汝等莫不喜逸而憚勞厭繁而思簡今既入道初階始則修事師之節次則執僧伽之勞以至晨昏動定微細行業皆依戒而行故謂之曰戒行汝等莫不生長於俗諦形質等同於凡夫今幸得登戒品內則具慈和之德外則著緇縵之衣又復居止同乎大衆行來皆尚雍容出世道業因戒方成少有所違即名干犯故謂之曰戒相汝等若能信聞而思思而受持欽遵律制護培德本庶上可契如來以戒攝生之旨下不愧息染慈濟之名汝等果能至誠領受如法奉行否一齊答云依教奉行和尚云既能依教奉行我今差諸引禮為汝等先請教授阿闍黎查驗衣鉢次請羯磨阿闍黎為汝等懺洗身心若衣鉢應法身無障遮來日登壇授汝等沙彌十戒而作比丘戒之階級也引禮云諸善男子一齊起立聞磬聲禮謝三拜分班先迎請者出班送和尚歸方丈二師轉下三拜已同引禮率衆送和尚歸方丈復回法堂再拜二師拜已仍將二人送師歸寮次禮謝諸引禮畢循循而散以候驗衣羯磨驗衣鉢第四若論沙彌衣式按薩婆多毗婆沙論云沙彌得畜上下二衣一當安陀會一當多羅僧令清淨入衆及行來時著又根本部云沙彌受縵條衣若年滿二十可授近圓師為求三衣鉢具所言當者非同比丘五條衣一長一短七條衣二長一短割截縫成如田畦畔但受持借五七之名縫成不用五七之相其云縵者謂無文也至近圓時師所求衣方是割截條相者義會律論之制大抵如斯然今無論三種沙彌輒披田相三衣亦不審起自何時沿習既遠未能頓革余從丙戌傳戒漸演毗尼至甲午冬方始反今崇古雖然勉行正制其間猶有方便若年自七歲以至十九欲受沙彌戒者定著縵衣若年滿二十已上決志登三壇戒者則非局於單持沙彌行法莫過漸次升進不躐其階級也所以於本界中權許受持田相二衣惟不聽著僧伽黎耳是以今授沙彌戒時三衣少一不得俟具儀請戒之後和尚則先令請教授師驗明衣鉢次令請羯磨師嚴淨身器按律中受比丘戒時差教授師屏處問云此三衣一鉢是汝自己有否名之為驗衣鉢今於沙彌戒而即驗之似乎太早但緣時非淳古人心矯詐者逾多本為假來衣鉢問之則答言已有及其受後仍回各還原主紊先聖之遺規欺堂上之清衆苟非預為勘驗則師資之咎二俱難逭故今設斯儀尤為急務和尚開導已歇息少頃復鳴楗椎新求戒者各持衣鉢詣作法所引禮令衆次第而立將衣鉢安置案上認取本衣位次而立勿致錯亂失儀二引禮統五人請師一人執香四人隨後臨堂就座已引禮云上香復位一齊向上聞磬聲作禮三拜長跪合掌二引禮向上一問訊復位義手白云善男子汝等形雖同乎沙彌心未沾於戒法既求息慈之律章宜著出世之法服故今遵奉和尚差命為汝等請師查驗衣鉢所有言詞各須諦聽師撫尺云夫出家至要戒行為先受戒正緣衣鉢為本良以釋子形儀逈異塵俗釋子心量不類凡情三衣若具乃可表性相以相資一鉢不離始足寡營求而辦道汝等今者欲求戒品若無衣鉢從他假借縱受戒已亦不得戒若師知而故與授戒者則墮非法之中是以我於未受戒前一一查驗若汝等正緣備具出家相成可謂如法如律如佛所教令汝衆等皆獲清淨戒為真釋子鳴尺一下今者現前所有衣鉢是汝衆等自己辦否衆答云是師云既有甚善但恐其中參雜故破三衣及紬綾五大上色今雖祗許沙彌受持二衣而汝等年歲既皆已滿不久將升寶壇期圓具足故須預為查驗莫致臨時倉卒復於所辦鉢盂必使合式方持若初離塵稟戒便披故破袈裟者則知求戒之因心不勝若始厭俗捨家即覓貴重紬綾者必是愛好之習氣未除即如大迦葉三衣百補憍陳如布服五錢至於衡嶽終身艾絮南山永絶絲羅而西天東土諸祖清儉如斯吾輩庸流可不倣效今我出位逐一查明以便復白和尚引禮云善男子等一拜而起各詣自己衣鉢之處候師親臨詳驗師出位諸引禮隨行一一詳查設有故破與夫借貸及紬綾上色者師當善言教誨令生歡喜如律再辦若循情悔律則非師模知法之流可不慎歟查訖師並引禮咸歸其位師撫尺云我為汝等查驗衣鉢已且幸爾等衣鉢備具應法緣成庶乎淨戒可受今夜當須至誠懺悔以便來日臨壇納戒引禮云善男子等一齊排班聞磬聲作禮三拜起立分班迎請者送師歸寮餘者立定如常送已還回衣所齊謝衆引禮師一拜各各認取自己衣鉢次第持歸本堂引禮末後而去其所驗衣鉢為防非法資具不因亡僧衣鉢而成遮也邇來訛傳謂亡僧衣鉢存者不宜持著斯皆未習毗尼不知所以按律中分亡僧衣物羯磨法云凡諸比丘雖依三寶出家財物必緣僧得佛法非分故入二僧應羯磨分之若未羯磨前私取從十方僧得罪若正羯磨時私取從現前僧得罪若是僧集和合如法白二羯磨與者誰云不用既亡衣不用則冢間死人棄衣佛令行頭陀行者洗淨補衲作糞掃衣此意復何消會良繇亡僧之物罕見罕聞遵律羯磨清淨著用今時每見為弟子者凡師長命過所遺衣物如子承父業不共衆分殊不知是盜僧物將為己財毒藥餌人反謂甘露誠可悲夫因舉世訛傳故此附辨露罪懺悔第五新戒露罪事途差殊稱量人法義準有四一初始出家即求受戒二剃髮已久今方求戒三出家有年唯稟五戒今思進修更求具戒四或於在家曾受五戒及受菩薩優婆塞戒今復出家乞求大戒就四種中臨時作法須分三門勿得一概雷同而令藥病相乖人法事三俱成非也審第一種求戒者若準南山羯磨受十戒法應問遮難此則惟問五逆名為戒障有即遮擯律制不容其四棄根本弒和尚闍黎等不必通問何以故彼初始出家即求受戒而三師既未請識四棄亦未受持是則無師可弒無戒可破唯審五逆不問七逆也審第二種求戒者所問戒障雖則不滿七逆而義有六逆蓋以離俗已久侍師多年準律當加弒闍黎一問且律中五種阿闍黎則剃髮師居首若有干犯法所不容理合遮擯審第三四兩種求戒者準諸經律七逆重罪四棄根本理應嚴詰以彼出家在家曾登戒品則和尚闍黎人人皆有四棄根本事事稟持既不類於前二種人應當別作一彚審之前來四種問法惟遵律制但今時非佛世五濁交爭或間干於國禁借脫空門苟非細審嚴徵何謂法門內護故今總述其科別加十惡詳問凡司重任者尤宜慎之其懺悔作法或當日或隔宿若律堂幽靜遠於市塵求戒者少又無餘緣即在當日先令審懺次受戒法若律堂雖居隱僻而求戒者多或集千指乃至更倍並有三寶因緣等事可於隔宿懺悔來朝受戒若律堂相鄰村城無論求戒者多寡但須稱量機宜當日隔宿隨便作法可也若隔宿審懺者入初夜分於羯磨堂中敷一座供以香花復於正座後側設一案俟書記謄録人事必使燈燭輝煌光明如晝香煙馥郁篆蓋若雲藉斯勝境莊嚴能令人心悚惕自然往愆無覆諸過露呈於作法時設有白衣和溷雜入其為引禮者當以方便却去令生歡喜至時鳴椎集諸求戒者其請羯磨師儀範如常師至堂禮佛升座已拈香舉香讚舉引禮云上香迎請者出班作禮三拜復位合掌汝等隨我音聲一齊朗誦大悲神呪仗此呪力潔淨壇場遠諸魔障誦呪之時切莫緘口偷安須知人人各有壇場各有魔障若不至誠朗誦則反增其過矣誦呪畢舉南無甘露王菩薩摩訶薩三稱引禮云善男子等一齊向上排班聞磬聲作禮三拜長跪合掌諦聽言音莫餘思覺今者和尚差我等嚴淨法堂焚香敷座恭請某律師為汝衆等作審罪懺悔阿闍黎梵語阿闍黎此云軌範亦云正行軌範者謂能軌範後學可儀可法以修行故正行者謂能糾正弟子直心直行以趣真故浣凡軀而成道器芟愛草以發心華皆繇此師如律開導依法懺悔若無此師淨滌三業助顯正因則佛法大海望洋而退幸今值遇似病逢醫是故至誠殷勤伸請請師之語汝合自陳恐汝未能我今教汝各稱法名衆齊稱名其餘言詞皆隨我道大德一心念我弟子某甲等今請大德為審罪懺悔阿闍黎願大德為我作審罪懺悔阿闍黎我依大德故得如法懺悔慈愍故如是三請已三叩首師撫尺云夫性體圓明本無生滅情塵覆蔽乃有聖凡是故急須早覺得以乘時進修但入道初門在乎翻染成淨若染心未斷惡業從生淨念現前梵行乃立我今臨堂為爾等懺悔三業正是翻染成淨之法蓋四洲六道惟南閻浮提人道最勝質近佛階易於修進幸今得預勝倫庶幾高超有地竊恐汝等從生以來於諸有中或作不善深厚業因既障出世大道復乖受戒勝緣必須淨滌琉璃瓶方堪盛貯獅子乳此時懺悔堂前如杲日麗天形影莫匿明鏡當臺目眉全彰汝等各各刳心瀝膽改往從新可於我前一一傾誠吐露若知罪含羞緘口隱覆者縱受亦不得戒何也繇染淨相參罪福雜糅於道無益趣證何從所言懺悔者務要具大信力生大慚愧故涅槃經云有二白法能救衆生一慚二愧慚者內自羞耻愧者發露向人雜阿含經云世間若無慚愧二法違越清淨道向生老病死是故應生慚愧深信業果汝等今則初入律門不知戒障名相名相不知與不問等故我先遵經律為汝等分別指陳汝等一一諦聽諦思覺察有無少頃次第出班如實發露鳴尺一下所言戒障者即汝衆人從昔以來意根憶持五逆十惡極重罪業是此審第一種人之總標於下釋義文中取有圖號數合此總標文用六逆十惡極重罪業是此審第二種人之總標於下釋義文中取有尖號數合此總標文用七逆十惡及四種根本重罪是此審三四兩種人之總標於下釋義之中順文總用不合號數若有一一犯者名曰戒障此乃律制禁遮不允受戒縱有因緣許其拔濟仍分機教以應懺門若是利根上智者必要深修禪定發本慧照觀身心如幻能所俱空了自性真常諸法不實一念相應契如如理證入無生此攝慧門為理懺也非謂塵勞暫歇便云登解脫場業性未空即號入寂滅海必須理觀精瑩實證無生方得罪花凋謝若中下機者必遵大乘方等熏修懺法觀三輪體空息六塵緣影尅期進道一七二七乃至月年求見好相若不見好相更加苦到倍增懇誠或盡其形壽必以見相為期此攝定門為事理懺也非謂身禮心散應事彰名豈以數日微善而免極惡重業所言五六七逆者逆謂不順於理背恩忘德反加違害世出世間法皆難逭下文乃順列七逆若審五逆六逆別取圓尖號數合用之第一出佛身血五逆中此居第五六逆中此居第一佛者乃天中之天聖中之聖萬德莊嚴十號具足無量劫來為衆生故修行所證無上妙法慈悲喜捨普濟含情而令三界九有同成覺道四生六趣永絶輪回是則須彌可傾大海可竭法王恩重窮劫難酬若不知恩報德頂戴供養而反加逆害出佛身血則罪莫可救是故佛言出佛身血名為戒障此逆準諸經律通云提婆達多以惡心故擲石害佛迸其小片傷佛足指今相好久已潛輝懺悔仍存舊問設有瞋惡心生毀壞一切佛像及佛舍利寶塔併諸大乘經典罪則同科亦名極惡第二弒父第三弒母五逆中此居第一第二六逆中此居第二第三弒者謂以下殺上故父母者乃子之所天理當竭力孝順不違其意冬溫夏清昏定晨省奉養無方服勞靡間聊盡人子之道少酬生育之恩豈宜反用惡心瞋心妄加弒害地藏經云若有衆生不孝父母或至弒害當墮無間地獄是故佛言弒父弒母名為戒障第四弒和尚五逆六逆中皆無此問和尚者此云力生謂三乘道力五分法身皆藉此師威德而生即得戒之本師也且於世間父母惟生色身恩尚無窮況乎出世父母令生戒體其恩何極所以佛制弟子侍和尚法律甚嚴詳蓋繇和尚之恩至深至廣應當如律承事而反加瞋心惡心弒害者是故佛言弒和尚名為戒障第五弒阿闍黎梵語阿闍黎此云軌範準律所制具有五種皆能軌範後學糾正修行故一剃髮阿闍黎能令脫俗離塵厭苦趣於淨樂故二羯磨阿闍黎能令清淨道器感發戒體故三教授阿闍黎能令變化粗浮威儀整肅故四依止阿闍黎能令毗尼通達善於開遮故乃至依止一宿者是五授經阿闍黎能令聞熏般若思修悟入故乃受受一句經此五種阿闍黎皆有如上恩德誠出世之良導真慧命之知識縱使身心竭力以奉餘年法乳之恩猶未寸報況反加瞋心惡心而行弒害者是故佛言弒阿闍黎名為戒障於七逆中用此文若明六逆中第四者可用向下之文以事義不同故別列一科第四弒阿闍黎梵語阿闍黎此云軌範今所問者非謂受戒之羯磨教授二阿闍黎亦非受戒後之依止阿闍黎也謂是汝等初始剃髮及授經二種阿闍黎也然此二種阿闍黎能令汝等出情愛之深坑親近三寶聞離欲之妙法了悟一真如此恩德不懷上報反以瞋心惡心而加弒害者是故佛言弒阿闍黎名為戒障第六破羯磨轉法輪僧五逆中此居第五六逆中此居第五羯磨者謂諸清淨比丘一界依棲六和水乳同一布薩同一羯磨名轉淨戒法輪若隨方攝化應緣接物宣演教觀如説修行名轉定慧法輪斯皆出塵道侶濟世智人司持三學為法門之梁棟化利羣生作苦海之舟航世間若無僧寶佛法何以弘通慧命其誰克紹繇斯毗尼住而正法久住故令人天增盛惡趣消除設使不知歸敬請益反以惡心瞋心而破壞者是故佛言破羯磨轉法輪僧名為戒障第七弒阿羅漢五逆中此居第三六逆中此居第六阿羅漢者善超諸有果證無生説法開萬有迷癡赴緣植衆生福慧能令現前護益報享當來不起敬仰難遭之心反加瞋惡弒害之毒是故佛言弒阿羅漢名為戒障此乃五六七逆之名義也鳴尺一下所言十惡者惡即不善繇衆生迷真逐妄計度識情觸境乖違動止纏縛於三業中造十惡罪集因深厚能招當來苦報故第一殺惡殺者謂自殺亦教他殺一切衆生皆以識息暖三為其命根此三不散謂之命存此三若離謂之命斷若於同類衆生中或因怨讐結恨以行殺若於異類衆生中或因貪味頤養以行殺如此傷慈興害而故斷衆生物命者則非合上聖濟生之德有損自己同體之仁是故名為第一殺惡第二盜惡盜者謂竊取他人財物蓋人世資生之緣名為外命然此財物有居家出家之不同居家物者或是父母宗親或是檀護相知及以非親非識等凡是他物屬於有主者俱不得盜取出家物者或是佛法物或是衆僧物佛法物者謂雕刻香像繪塑金容印造藏典書寫經文其中一切莊嚴等物是衆僧物者準南山事鈔類分四種一常住常住物謂衆僧厨庫寺舍一切花果樹木園林僕畜等不通餘界但得受用不聽分賣故重言常住常住二十方常住物如供僧常食體通十方隨時受用唯局木處三現前僧物謂僧得施之物唯施此處現前不通十方僧故四十方現前僧物如亡比丘比丘尼式叉摩那沙彌沙彌尼等五衆輕物雖十方現前各有其分若羯磨分畢後來絶望須知三寶財物皆出信施彼求當來樂報故植今世福田因果一錯業果歸身況復竊取以為己有是故名為第二盜惡第三淫惡淫者謂淫泆乃世間最猥媟事然一切衆生輪回生死此為根本或於六親男女及非親男女邊而行不淨或破他梵行乃至污僧伽藍或侵淩貞潔玷彼清名繇斯自墮無間備嬰諸苦是故名為第三淫惡第四妄語惡妄語者謂搆造虗言欲人取信然妄語有大小之別大妄語者謂未得言得未證言證以貪圖名利顯異惑衆故成大妄語也小妄語者謂不見言見見言不見聞言不聞不聞言聞以慢習矯詐輕侮前人則成小妄語也如此自欺欺他諂曲不直是故名為第四妄語惡第五兩舌惡兩舌者謂宣傳彼此鬬搆是非或因懷隙報私或因障他勝己則與兩處挑唆明譽暗害使其上下乖諍離間親緣怨無控訴自德全虧是故名為第五兩舌惡第六惡口惡惡口者謂出言粗獷取辱於人或因貪欲不遂或因戲謔生瞋晦昧綱常喪失倫理尊卑不遜任意毀呰觸他不樂快暢自心是故名為第六惡口惡第七綺語惡綺語者謂乖真背理巧飾言辭或因矜己才能隨情衒惑或因壞他名德逞口鼓簧令人視聽增其情識蕩其心志是故名為第七綺語惡第八貪欲惡貪欲者謂適意愛染念無休息居家者則以功名富貴巧計恣求出家者則以利養名聞自甘邪命於順情境上取足無期聞惠濟則吝於秋毫見樂著則黏於膠漆種種追求不畏業苦是故名為第八貪欲惡第九瞋恚惡瞋恚者謂事與心乖縱恣惡性或因居家名利財産求而不遂起諸恚恨或於出家四事資緣難從希望便發瞋心經云菩薩起一瞋心即開百萬種障門是故名為第九瞋恚惡第十邪見惡邪見者謂愚癡無正慧知見多偏僻繇不了苦集滅道四諦之法而妄計有無常斷之見撥無染淨因果毀滅出世善根正信灰然邪心熾盛如此方天主白蓮無為觀指聞香等教自盲盲人皆墮坑塹生則華報王刑死則果嬰地獄千佛出世不通懺悔是故名為第十邪見惡此乃十惡之名義也若審第一二兩種求戒者不必問下四種根本直接後文云善男子等今既普聽我語云云若審第三四兩種求戒者當問四根本鳴尺云所言四種根本者汝等或於居家時曾受優婆塞之五戒及菩薩六重二十八輕戒或於剃髮後曾受五支淨戒但其中前之殺盜淫及大妄語四種禁戒者乃是沙彌十戒比丘具足戒菩薩三聚大戒之根本若授受之後不固守持隨犯一戒更不得再受十戒具足戒并菩薩大戒然此殺盜淫妄之罪較前十惡中之殺盜淫妄苦報倍更增劇以破佛淨戒故鳴尺云善男子等今既普聽我語各各了知如上諸惡業中隨有所犯向我傾心吐露纖毫不得覆隱若少有瑕疵仍是戒障譬如洗浣故衣必要本體潔白垢膩盡淨方堪受新染色我今逐一問汝汝等次第出班一一實答鳴尺一下引禮云諸善男子一齊起立聞磬聲作禮三拜分班兩立若衆多者令三人一齊發露少則一人次第發露其為師者勿以久坐生疲應事忽略必也誨人不倦慈教諄諄其為引禮者既輔法門為人加已亦勿辭勞衆分立竟先從首班三人向師一行立定引禮云善男子聞磬聲作禮三拜若衆多一拜亦可長跪合掌汝等三業至誠隨我音聲稱南無十方常住三寶三稱各稱自己法名稱已師撫尺云善男子我今先問汝五逆戒障次問汝十惡重業審第一種問此六逆戒障次問汝十惡重業審第二種問此七逆戒障次問汝十惡重業及四種根本審第三四兩種問此下文總列七逆若審五逆六逆者照上圓尖號用之五逆中出佛身血居第五六逆中出佛身血居第一鳴尺云第一汝曾出佛身血否有則言有無則言無傍人不得教答有無由恐臨問不知是以前來一一詳細指示今當自言不須教答下皆同此善男子當知釋迦如來正法千年已過像法千年亦過此乃末法萬年時又過六百餘年矣雖無出佛身血者然有雕繪鑄塑之聖容及佛舍利之塔廟大乘實相般若了義圓頓經文曾以瞋心惡心而毀壞者則與此罪同科汝曾有否有無如實再答五逆中弒父居第一弒母居第二六逆中弒父居第二弒母居第三第二汝曾弒父否如前實答第三汝曾弒母否如前實答人有三父八母必是生身者方名逆罪餘雖非逆亦並攝在殺惡中問第四汝曾弒和尚否如前實答此問惟七逆所攝五逆六逆中無六逆中弒阿闍黎居第四第五汝曾弒阿闍黎否如前實答此中如上所明五種阿闍黎更有五戒阿闍黎如於在家時曾受八關齋戒者則有八戒阿闍黎隨彼曾受何戒則問何等阿闍黎五逆中破羯磨轉法輪僧居第四六逆中破羯磨轉法輪僧居第五第六汝曾破羯磨轉法輪僧否如前實答此一問中有二種一謂破僧倫二謂破羯磨僧有處云破和合僧其云和合僧者乃總攝斯二種以破則不和和則不破今言破者謂乖背六和之道也佛言破和合僧有二一妄語二相似語或羯磨或行籌若破僧倫下至九人一人自稱作佛必要男子方能界內界外盡可破壞其所破者是俗諦僧局在南閻浮提犯逆罪偷蘭遮不可懺若破羯磨僧下至八人不自稱作佛女人亦能要在界內別作羯磨布薩其所破者亦破第一義諦僧通三天下犯非逆罪偷蘭遮可懺然云破僧倫亦提婆達多事今無此罪其破羯磨僧者容或有之五逆中弒阿羅漢居第三六逆中弒阿羅漢居第六第七汝曾弒阿羅漢否如前實答此六五七逆既無更有十惡今當問汝鳴尺一下云第一汝曾殺害同類中男女等命否如前實答汝曾殺害異類中一切畜生物命否如前實答此中審者若在家時曾斷人命有干國禁關係法門等重事者應須遮之然此問中必須詳究其致勿忽草草下盜惡重者以類此若斷畜生命等但須殷重悔過不類遮障若出家已雖未受戒然於行殺必不可為若斷人命定當遮擯若斷畜生命令作懺悔若在家出家於受戒後有犯此條則攝四根本中分別輕重問殺之輕重既攝四根本中此處何繁別審答為足成十惡故為不亂法數故若總攝四根本中問則十惡法數既缺而未受戒者更置之何問第二汝曾盜取世俗一切有主物否有無實答汝曾盜佛法僧三寶財物否有無實答此中審者若未出家同黨劫盜官民等重物者此則國法難容佛律不收若盜取三寶物者準善生經七種戒障中盜現前僧物亦當遮之若出家來未受戒時盜取世俗有主重物及三寶一切等物者是不畏王法不信因果不怖地獄非真道器亦應當遮若在家出家受戒後有此事者攝後四根本中第三汝曾於六親男女及非親男女邊行淫否有無實答汝曾破他梵行污清淨僧伽藍否有無實答此中審者若未出家時於父六親謂伯叔兄弟子孫母六親謂姑姨姊妹女孫等邊行淫或破淨行比丘尼戒此二準善生經七種戒障中於六親所行淫污比丘尼應當遮之若出家已雖未受戒然於此事必不可為或從親與非親邊一切男女行此不淨乃至污僧伽藍者亦當遮之若在家出家受戒後有此不淨事者攝後四根本中第四汝曾妄言自稱得禪得定得通否有無實答汝剃髮後共僧住止自未受戒詐稱比丘與衆僧一處同布薩同羯磨同利養受人恭敬禮拜否有無實答此中審者若未出家時妄言悟道欺誑賢聖輕視沙門今雖出家非真實法器亦難受戒理應遮之若已出家未沾戒品詐稱比丘同衆布薩羯磨均享利養未曾悟道妄言悟道若但一次或可開除若恆常欺誑一切者亦遮擯之若在家出家受戒後犯此事者攝後四根本中第五汝曾傳送是非挑唆彼此離間恩愛損他産業令人愁苦不得安樂否有無實答汝剃髮後與衆同居曾鬬搆兩頭令上下不和否有無實答此中審者若在家時曾作離間鬬搆等語有干人命令彼抱怨終身負屈無伸者宜當遮之若能改往知非生大慚愧苦切哀懇亦可容受若出家已無論向彼道俗作此兩舌語令他不和有係人命身家者亦當遮之必須至誠懇責去其惡習更不復作者方可許受第六汝曾忤慢一切毀呰上下出言粗獷令人受辱懷惱否有無實答此中審者無論在家出家時凡作此惡口語者當以方便開導苦切勸勉令彼知非改過能恆起慈忍心更不作惡口業者方許受戒第七汝曾虗架言辭巧用文字背真逆理以無德者莊飾有德於有德者貶斥無德誑惑他人令彼失於正智增長邪見否有無實答此中審者無論在家出家受戒與未受戒曾作此等喪德敗倫干係國政有礙法門者不得受戒以護世諦譏訶保全僧倫尊德故若能誓不更作苦心進道者似可容之受戒第八汝曾於順情境上種種樂著心無厭捨但欲己得不顧損他毫無惠濟喪失仁慈乃至不供父母師長上下眷屬否有無實答此中審者凡出家人必先空諸所有息滅攀緣苟或貪得無厭難滿難養則塵纍縻於道懸絶但今法末僧多同俗己業不辦溺於世緣故先令其慚愧知足然後持戒可保且戒乃正順解脫之本倘於諸境不能解脫者而於白業何從故不可易與之受戒令洗前心庶植道種第九汝曾於違情境上多起忿恚瞋惱自他詛呪神明怨黷天地罵詈父母師長否有無實答比中審者凡出家人必須攝護自心多修忍度縱有違情境界當自折伏一有逆境現前便鼓蕩瞋火或詛呪神明或怨黷天地乃至罵詈父母師長俗諦中人尚犯刑禁出家修道豈得容此無知瞋惱之事乎故須鞫問第十汝曾親近邪師從習邪教宣卷唱偈觀指聞香謬解諦理盲引諸人為師為弟自陷陷人否有無實答此中審者凡是出家之人先須明識四諦四果後依八正道中修行方能遠離邪僻虛偽之法若邪見不除淨戒難受設受戒已恐作破內外道故於未受戒前更加審察若有其人必用惡辣鉗錘斷邪根令堅正信然後與之授受如猶豫兩楹信力不定者仍須遮之以保重法門選釋正信邇來愚邪熾盛尤宜嚴審善男子七逆十惡既無四種根本應問若審第三四兩種方問四根本如下文所言若審第一二兩種不必用此及下文殺盜淫妄四戒即結云善男子上來所問戒障十惡既無犯者名為淨器作禮而起引禮令一拜起已出壇又呼第二班進第一殺戒有犯否有無實答此中若斷同類命者名破根本不容再受若殺而命不斷者準律治之不名破根本若故斷異類命者令作應懺突吉羅悔過若斷而未死亦突吉羅罪若心無殺機倐爾誤傷者作責心突吉羅悔過後莫更作若在家時受菩薩優婆塞六重二十八輕戒者不論同類非同類凡起瞋惡之心斷彼命者皆名破根本廣如大乘十二門分別玄義説第二盜戒有犯否有無實答此中若盜五錢名破根本不容再受若減五錢乃至一錢者令作應懺突吉羅悔過若盜過五錢按錢定罪俱難容懺廣如大乘十二門分別玄義中詳明第三淫戒有犯否有無實答此中出家五衆全斷淫欲在家二衆惟斷邪淫於己妻妾復制非時非處非時者或在日中或六齋八王年三月齋或自妻娠妊産後等非處者除大小便道及口中若見機許開唯是在家菩薩出家決無聽允凡七衆受戒者作此不淨行俱名破根本若無樂心作不成者準律治之不名破根本廣如大乘十二門分別玄義中説第四妄語戒有犯否有無實答此中若自稱言我得上人法得禪得定得果天龍鬼神俱來供養等向前人説時語言了了名破根本若説而不了了容有開除廣如大乘十二門分別玄義中説善男子上來所問戒障十惡及四種根本既無犯者名為淨器起立而退引禮云一齊起立聞磬聲作禮三拜若衆多一拜亦可出堂上殿禮佛候鳴楗椎同衆入堂懺悔回向彼等作禮去已復呼云第二班出衆發露懺悔如是班數若干次第審畢鳴楗椎三下諸求戒者徐徐入堂如前分列引禮云一齊向上排班聞磬聲作禮三拜長跪合掌師撫尺云善男子汝等時間已於我所各各陳説往愆當思懺悔堂中伽藍地上三寶光臨萬神鎮護五眼圓見六通共知倘有餘愆未瀉不妨披心露膽向我更説如浣故衣雖去垢迹必須洗而再洗方堪易受染色是故我今再問汝等再答果無則是真淨法器有則戒品難登鳴尺一下汝等各各説罪已竟否有無實答於中或有先忘後憶者答云未説竟師鳴尺問云汝有何事未曾説竟今當向我直言準前五逆六逆七逆三科中應機詳審以定輕重可知書記所録人名罪事之册離位至師座前一問訊呈上若輕者即座稱量開除若重者呈上和尚或者應機巧濟遵依大乘方等作法未知善男子汝等發露雖竟但是現生所作所為者然從無始以來未識佛時未聞法時未遇僧時受無量之身形造無量之罪業識情昏惑不覺不知唯有諸佛菩薩徹知徹見罪惡多少若輕若重今向十方三寶渴仰翹勤至心作觀隨我音聲重伸懺悔各稱法名衆稱名已師舉偈云衆和禮往昔所造諸惡業皆繇無始貪瞋癡一切罪障皆從身語意之所生今對佛前求懺悔一切罪根皆諸受戒法中通用此四句偈懺悔無始罪愆非是草草舉和而已為師者當起大悲苦之心求懺者必具深信慚愧之念舉此一聲音徹恆沙佛剎運此一念形遍諸佛座前然我身不往諸佛不來感應道交能所俱寂更願以此懺悔功德普與法界一切衆生同消業障共脫苦淪如是舉和名普賢願行真懺悔也懺悔功德殊勝行無邊勝福皆回向普願沈溺諸有情速往無量光佛剎十方三世一切佛一切菩薩摩訶薩摩訶般若波羅蜜上來發露懺悔已竟各宜靜其心慮辦其衣鉢並律中當學經書一一覓請恭候和尚明晨升座乞受沙彌十戒汝等各各能依教奉行否答依教奉行其間審問若無重遮者如常下座若有干犯重遮者師當對衆語之云今衆中某某有犯重遮此之極重罪障律中佛制森嚴吾所不敢擅專明晨呈白和尚會同師僧上座若堪提拔者準教應機和尚自有方便若不堪提拔者縱諸佛出世亦難救濟須發深大慚愧不可忽為泛常汝且隨衆暫退引禮云一齊起立聞磬聲禮謝三拜分班迎請者送師歸寮送師歸寮已還至羯磨堂中其新求戒者普謝諸引禮書記師三拜以酬佐助作法成就懺悔之功引禮統衆上殿教彼通宵禮佛各稟虔誠勿生懈惓呈罪稱量第六若審問中有犯重者次早諸引禮會同書記先於各堂查明人數若干呼至一處彼等向諸引禮及書記師一觸禮起立一旁引禮云昨夜羯磨堂中審問已將汝等所發露者登記於册但此事極重我今先引汝等往羯磨師寮乞求垂憫同詣方丈呈白和尚汝等可隨我去發露者隨引禮書記至羯磨寮如常作禮口自伸請懇求作法救拔羯磨師云汝等自陳過罪可謂知慚愧者然則善惡繇心罪福自受幸汝覺察其非或可方便救濟又況汝哀求至誠我今何忍坐視汝且隨我同詣方丈其諸可否聽憑和尚教命聞已一拜而起即隨師等同往方丈引禮安彼有事者立候門外先通知侍者傳白和尚和尚出方丈升座羯磨師向上一觸禮次引禮書記同作禮三拜呈上罪册和尚展看即差侍者請諸闍黎及各堂首領至方丈已同禮和尚三拜分列兩序引禮喚外有事者進至座前如常頂禮合掌長跪和尚撫尺云汝等雖發好心乞求戒法奈何造作重罪污穢道器律制森嚴人情難允若果能具大慚愧發大道心者吾今會同知律師僧遵依大乘方等懺法格外拔濟按三千諸佛名經中佛言若有衆生欲除滅四種禁罪欲得懺悔五逆十惡欲得除滅無根謗法極重之罪當勤禮敬五十三佛名號及三千諸佛萬德洪名良以諸佛稱三界大師四生慈父無苦不救無樂不與衆生但有一毫之善佛即垂手拯拔其禮懺時必要洗浣身衣虔備香燭或一七乃至七七求見好相若覩好相光華瑞現則知罪滅無疑仍是清淨道器設若禮懺時中或心不專一或儀不虔恭不信罪福不怖地獄者佛慈雖普應感難交如月朗中天濁水不現莫如之何鳴尺一下汝能如是依教奉行否答能依教奉行和尚向兩序議云諸大德今準方等教法與彼懺悔可否衆齊答云可爾和尚云既諸大德同心稱量皆云可爾者本堂引禮為彼擇處安之便於至誠攝心禮懺禮懺若竟再來復白引禮如常教彼作禮仍於門旁立定諸闍黎師向上禮拜已俟和尚入室然後各散引禮將彼各處禮謝即安頓於某佛像前禮懺若懺禮竟先白本堂引禮師或見好相或言不見次引禮方導至羯磨師寮亦如是白遂引往各堂禮請大衆俱集方丈集已將禮懺者立於門外候和尚出室升座已大衆作禮三拜引禮呼彼進如常頂禮三拜合掌長跪和尚憑衆詳問彼禮懺中曾見好相未若答曾見者仍準經中見相之由察其可否若諦實者即許受戒若語言相似者及云不見好相者和尚盥手焚香親書三鬮一云許受一云再懺一云不許和尚統衆上殿將三鬮供之佛前和尚拈香頂禮默禱云仰白十方法界大覺世尊一切菩薩今有某省某郡某甲發心於我比丘某甲所乞受淨戒彼於現身作極惡業干犯某重遮毀破某禁戒我比丘某甲不敢故違律制擅許受戒曾遵大乘方等令彼頂禮諸佛洪名稱揚萬德聖號求見好相彼禮已竟相好未覩或恐障深信浮三業不虔今向諸佛菩薩前代為懇禱惟願不捨衆生慈悲攝受令彼道器清淨罪業消除得稟戒法如律修行併具一切毀破禁戒作諸惡業有情同入如來毗尼海中具足斷德圓滿法身今以三鬮為準聖鑒無私重懇哀憐乞垂慈攝和尚如是運想默禱作禮三拜次大衆亦如是發大悲苦心默禮三拜此乃普賢行門法儀勿作隨衆之想大衆禮畢兩立引禮呼求懺者進教令至誠發願作觀運心普禮法界常住三寶三拜跪下於佛前隨手拈一鬮舒開衆見若拈得許受者即令同衆受戒若拈得再懺者仍去如法禮懺懺竟即與受戒不須再拈鬮矣若拈得不許者仍須禮懺重增苦到不限期數必以拈得許受為定如是一次二次乃至數十次一一如上集衆作法而佛制斷不循情若最初審懺泛常受後豈能堅守故今儀中重沓作法勿厭其繁瑣無非令其師資清淨自他獲益以樹末運之光明戒幢而澄清毗尼法海也
