body:
  text: 金陵寶華山司律沙門讀體撰二壇授比丘戒前請戒懺悔儀習儀第一決定論云比丘戒四分義攝一受具足二隨具足三護他心具足四具足守持而云護他心具足者謂比丘有一分威儀具足能護長他人之淨信故令彼欣敬攝歸佛法故為釋子者威儀不具則動止違防出入招譏緇門警訓云世尊處世深達物機凡所施為必以威儀為主蓋繇大聖洪慈曲已調御衆生內則軌範僧徒外則利益檀護矧今末世去佛且遙必也全藉律儀建立三寶是故沙彌年滿是丈夫位而於登壇受具之前應習儀政禮若圓具沙彌多應用籤編名以三人為一壇一籤列三壇內遷一人為首統餘八人若進具者少直以壇次為準不必編籤於進具前三日引禮師令淨人灑掃法堂於中平敷一座至時鳴楗椎集諸圖具者行列已二引禮將五人往請教授師師受請出寮侍者捧籤於後入堂侍師就座侍者置籤案上引禮云上香復位一齊向上排班展具聞磬聲作禮三拜撩衣拜已長跪合掌師撫尺云諸沙彌汝等今欲進具入僧寶數須知具足四義中有一分威儀具足戒也威者謂清嚴可畏儀者謂形儀可軌良以僧寶尊重司任非輕嚴淨毗尼住持正法能除飢饉為人世福田導化衆生趣涅槃妙果俾見聞敬仰己信重增如馬勝雍容行道感采菽以信樂出家鶖子安庠乞食攝外道而反邪歸正古今沙門威儀攝物利生者固難枚舉大抵三千八萬之細行不出行住坐臥之四儀其中一一皆有方便善護他人淨信而克成己躬之道業故今遵奉和尚慈命先為汝等習儀三日次方請戒懺悔登壇授受庶使臨期威儀有則爾等或久參林下親近知識氣質諒已變化舉止自合規模倘有乍入伽藍未經淘汰者性情那得消鎔動靜必乖繩墨所以金非煅煉終是頑礦玉必琢磨方成良器今將汝等諸人名目編入籤次以便習儀其所編籤號以三人一壇受具一籤則列三壇於每籤內令一人為首統餘八人如是九人互相謙恭循禮出入貫珠凡諸不諳之儀威藉衆引禮師慈悲善訓勿憚勞辛儒云不矜細行終纍大德況為佛弟子者而不慎歟鳴尺一下汝等能依教奉行否衆齊答云依教奉行師云既能依教奉行可謂如法和尚復於懺悔堂中差諸位大德一位驗籤師一位繳籤師一位書記師幾位巡視師其驗籤者於發露時防有白衣外道等溷入盜聽故請某師為汝等照籤驗明逐一令進其繳籤者於發露已恐有狡侫不肖竊伺他非故請某師撤繳原籤照名令出其書記者於發露中仍恐名罪相同多於舛錯故請書記某師登記名目不致忽略其巡視者繇於懺摩必須嚴肅人心或恐易怠又虞夜靜私寢班坐雜談故請某某衆師檢察䇿進勿致昏散如上所差諸師皆有成濟佐助之功汝等應當恭敬作禮勿得我慢輕心有辜教詔引禮云諸沙彌一拜起具分班左右序立次第散籤畢迦請者送師歸寮復回散籤所謝衆引禮師一拜引禮復令沙彌請彼受差諸師至堂教其普禮三拜候諸師散去引禮率諸沙彌各歸本堂引禮即將圓具壇榜張貼示論使其人各知其受具壇數不致紊亂戒次之先後也請戒開導第二薩婆多律論云若發微品心受微品戒若發中品心受中品戒若發上品心受上品戒故知戒體本一而無優劣繇心緣感遂有差殊若待登壇作法方教發上品心得上品戒者彼等茫無所知不識何等是上品心也譬如空雷發於奇峯之巔甘雨絶於流金之地則難覺解了無納受是以今於未受之前先啓和尚預為開導使其臨壇猛惺上品心生體具周圓孰非勝戒於請戒晨朝先淨法堂敷設法座至時鳴椎集彼求具沙彌班中前四籤首往請衆引禮師至堂已諸沙彌向衆引禮師三拜起立為首者合掌白云我沙彌某甲等一介愚頑那識律詮軌範仗師良導少知僧行威儀漸熏樂欲心生更冀稟持念切故今仍懇諸師再為啓白和尚如是白已叉手問訊引禮云諸沙彌觀汝等進具之意最真而懇求之語至切信力如是所願必成衆中為首者出班九人一人執香隨我同往方丈禮請和尚其餘立定整肅威儀俟聆教誨到方丈如常作禮和尚受請至堂升座迎請者各歸本班四引禮向座展大具三拜長跪合掌先代通白仰白和尚大慈忍聽彼沙彌某甲等威儀略諳求具志殷希入僧倫欲躋聖域故今先詣座前頂禮啓白惟願和尚智鑑稱量可否如或機堪拔濟少賜矜憐預為開導如是白已三拜起具分立左右呼云上香復立諸沙彌一齊向上排班展大具聞磬聲頂禮三拜撩衣拜已長跪合掌所有乞戒言辭汝當自白為首者朗白云人身難得中國難生佛道難遇戒法難受我某甲等幸逢大和尚樹光明幢張淨梵網接引凡流攝歸僧寶願錫我某甲等具足大戒如律行持成道利生用酬恩德白已諸沙彌齊一叩首合掌誡諦跪聽和尚撫尺云夫采如意珠而入海從淺至深稟具足戒而登壇繇小進大戒寶非踰跨可求佛制必相應方授未有不歷沙彌行業而直趨大僧名位者也今爾諸人既已守持息慈學處復能求受比丘律儀則階級無越理合增修況乎請懇殷誠吾豈吝而不授但此具足大戒尊重所任靡輕是正法久住之根源僧伽蕃衍之命脈非具足則僧倫無以崇立非僧寶則佛法何以弘通故於天人魔梵外道婆羅門衆中比丘僧最為第一所以欲圓具戒非處莫託必依白二羯磨結界之地故律云非羯磨地不得在內受欲行僧事處既如法於中建壇十師數必滿足遴請如法精嚴故律論云和尚二阿闍黎並須如法七僧為證皆清淨明曉若無和尚若十僧不滿皆不成就故師雖如是又要汝等身無難遮故律云身相不具百遮等人及自破淨行污他梵行皆不得受具道器雖具正為汝等秉宣白四聖教發體之時仍須文句不得增減差脫作白羯磨咸欽律檢斯可不墮非法縱然外緣俱成而汝等乞戒之心復有三品所謂上中下也隨其所發之心則隨感上中下品之戒然以具足戒之戒法戒體戒行戒相與前沙彌受持者百倍千倍不能比喻苟不識知如是深義雖云登壇授受受已還同未受似僧非是真僧與衆共住名曰啞羊比丘同僧法事呼為摩和羅輩若欲紹隆三寶利益羣生斯之功德何繇可克故我今於未登壇前開導明了令汝等正受戒時領解不昧所言上品心受上品戒者即汝等來朝壇上能發堅固信力普於法界一切有情無情境上起廣大慈護之心除不善損害之念誓斷一切惡誓修一切善誓度一切衆生於中不怖不退志願堅深此則謂之發上品心受上品戒誠所謂內祕菩薩行外現是聲聞能住正法建立僧倫若縱有慈護心而護之不普亦緣法界境而緣之不周於度生邊似有怖退志願未能深堅者謂之中下品心此心狹劣非勝所獲之戒但是中下品爾此戒僅可自利止宿草庵既缺利他佛種奚紹是以今欲汝等發上品心受上品戒而不欲汝等起卑劣心受中下品戒也所言戒法者即世尊成道十二年中觀有漏因緣事起而為諸無事比丘禁防三毒調伏七支金口所制二百五十淨戒一百八十四種羯磨乃至三千八萬無量律儀是也所言戒體者即是來朝於十師座前正秉羯磨時爾等發上品心之思業力用運想法界遍緣一切塵境而境從心現然所現之境非有表色即是法界一切塵境之體亦即得戒之因若未緣想領受已前此塵境體於汝無繫但一發心緣想領受已後此法界塵境體恆依汝等自心念念不忘時時守護是以戒為能依心是所依心法和合名為戒體如藥丸喻可以例知所言戒行者即依本所受之戒體於日用處或讀誦或安禪或熏禮懺法或修持淨業乃至著衣受食等皆不違越毗尼所以一切行盡名戒行非謂一切行外而別有戒行出世行業悉以淨戒而為本也所言戒相者即佛所制二百五十具戒一百八十四種羯磨於一一戒相中所明輕重開遮於一一羯磨內所攝成壞兩緣此即法相也於日用四儀間常所行時事及非時事此即行相也其法因事制事依法成若一切善業等事如法當行而不行此名之止犯若當行而即行此名之作持若一切惡業等事非法不當行而行此名之作犯若不當行而不行此名之止持若罔知止犯作持止持作犯則開遮全晦成壞茫然是故律制比丘五夏以前專精戒學五夏以後方可聽教參禪蓋為令其識相護體冀生定慧出世道業方有所據汝等若能如是信解如是受持庶合聖德真是出家持法之子故首稜嚴經云將此深心奉塵剎是則名為報佛恩汝等能依教奉行否答云依教奉行和尚云既能依教奉行者今夜當請羯磨阿闍黎先審汝等沙彌十支禁戒若守持無染可謂真淨道器少有違犯仍是雜穢身心必須苦切痛訶依律懺悔更有十三重難十六輕遮於臨壇時方差教授師屏處別問至秉羯磨對衆復再嚴詰我今令衆引禮大德將汝等往詣二師寮白知啓請受具開導等情俟作法審懺中若果無犯重不毀根本者方可集會同界大僧於彼衆中恭請十師登壇為爾諸人授大比丘戒衆引禮大德如我所語即當奉行衆引禮曲躬合掌齊答云如和尚所命四引禮轉身向上展具三拜仍分列左右呼云諸沙彌一齊起立聞磬聲禮謝三拜撩衣拜已起具分班迎請者送和尚歸方丈如常禮送和尚歸方丈已復回法堂衆沙彌同謝衆引禮師三拜起分兩立通白二師第三欲授具足大戒必須三師水乳一界六和律法相應乃可授受今諸沙彌雖請和尚開導而懺悔教誡任在二師故復令其禮拜通知其通白二師即在請戒竟引禮命沙彌撒去法座仍序班次而立一引禮將二沙彌先請羯磨師至堂引禮向師一觸禮起立呼諸沙彌展具作禮三拜長跪合掌引禮叉手代衆白云彼沙彌某甲等時間申請和尚稟受具戒已蒙慈允預為開導但未知其勤䇿本戒持犯若何故和尚差我某甲等率諸沙彌先為通白羯磨阿闍黎師於今夜分敷座恭請惟冀臨堂如律作法慈愍故引禮白已呼沙彌等一叩首羯磨師云善哉沙彌可爾為汝等臨堂作法人各靜其心慮忖其持犯至時集候如實懺悔衆答云依教奉行引禮呼沙彌等三拜起具先請者仍送師歸寮復引二沙彌往請教授師至堂如上作禮長跪合掌引禮代衆白云彼沙彌某甲等適間頂禮和尚啓請進具幸蒙垂憐如律開導已令請羯磨師今夜懺悔仍恐威儀缺略不應法緣故復差我某甲等統諸沙彌通白教授阿闍黎師伏祈重警未諳再錫慈音慈愍故引禮白已沙彌等一叩首教授師云善哉沙彌如彼代言深可慶幸更希教誡威儀諒已演習如法其大比丘隨律軌則待近圓後方可一一教誡衆答云依教奉行如前禮送師歸寮復回法堂普謝衆引禮師次第各還本堂教衣鉢第四初壇受沙彌戒先驗衣鉢者恐間有缺少借貸或干非法等類必令更換再備今則將登寶壇因進具戒諸凡行持莫不同乎大僧若衣鉢名相事義不知所繇則用處皆錯時時犯非是以教授師應先指示俾其一一通曉於登壇日往屏所問難間但略言道具以免稽留於通白二師已少頃復令淨人往法堂鳴楗椎引禮師令進具沙彌各各身著七衣捧持五大二衣挂鉢攜具次第入堂序列班次將所持衣置於案上如常儀請教授師至堂已引禮云上香復位諸沙彌向上排班展具聞磬聲作禮三拜撩衣拜已長跪合掌彼沙彌某甲等將欲登壇稟受具足所有衣鉢事義若不知其制起源繇恐難受持合轍故今禮請教授阿闍黎師指示分明令彼等如律奉行庶符聖意引禮白已沙彌等一叩首合掌跪聽教授師云此出古戒壇文夫三衣裁製即如來金口親宣一鉢受持乃釋子資身貴器壞色則迥超俗服應量則有異常倫服之者忍辱倍增持之者功德具足價重七珍之寶難可測量功高萬仞之岡豈能仰望百千萬億人天咸皆稽首九十六種外道悉不知名惟有吾佛出世示此未曾有法俾見聞者利益無涯受持者身心俱淨若欲知其三衣之縱廣一鉢之大小非開示莫能明義不解説安可知源今則將授大戒先示汝等衣鉢名相汝當知之鳴尺一下汝等袱中各有五條衣梵語安陀會此云作務衣亦云下衣亦云雜作衣凡寺中執勞服役路途出入往還當著此衣汝等身上所披七條衣梵語鬱多羅僧此云入衆衣亦云上著衣凡禮佛修懺誦經坐禪赴齋聽講安居自恣乃至一切集僧辦事當著此衣汝等袱中各有大衣梵語僧伽黎此云雜碎衣謂剪碎縫成條相多故凡入王宮升座説法聚落乞食半月布薩降伏外道之時當著此衣然此大衣多種不同謂上中下各有三品所言下三品大衣者謂下下品九條下中品十一條下上品十三條此三品衣皆兩長一短割截衣持所言中三品大衣者謂中下品十五條中中品十七條中上品十九條此三品大衣皆三長一短割截衣持所言上三品大衣者謂上下品二十一條上中品二十三條上上品二十五條此三品大衣皆四長一短割截衣持此之三衣者名福田衣僧祇律云佛在王舍城帝釋石窟前經行語阿難言過去諸佛衣相如是從今依此製作衣相增輝記云田畦貯水生長禾苗以養形命衣相福田潤以四利之水增其三善之苗養以法身之慧命也釋其名者服上謂之曰衣衣者依也故衣以蔽寒暑也經律皆名袈裟真諦雜記云袈裟外國都邑名含多義或名離塵服斷六塵故或名消瘦服割煩惱故或名蓮華服離染著故或名間色服如法色故今所謂壞色衣也此衣必為三者何也表三業清淨故以五條斷貪身業也七條斷瞋口業也大衣斷癡意業也長多短少表聖增凡減也用青黑木蘭三色者表法報化三身也體則用熟苧布不得用綾羅紗絹之物表慈悲也汝等各有坐具一方所言坐具者梵語尼師壇此云隨坐衣又云敷具又云襯足衣即如塔之有基汝今受戒之身即五分法身之塔也良繇五分法身因戒生故汝等各有一鉢所言鉢者梵語鉢多羅此云應量器謂體色量三皆如法故體則鐵瓦二物色則用麻子杏仁搗碎塗其內外以竹煙熏治作鳩鴿孔色所以熏者何為夏天盛物不餿不染垢膩有此功德故當熏治量則上鉢斗半下鉢五升中鉢可知此乃姬周斗也若準唐斗上鉢一斗下鉢五升中鉢七升半也此衣此鉢是汝受戒之正緣資身之急務要須自己置辦若借若無並名非法準律明條皆不得戒一生虗受信施將來墜墮三塗常劫輪回無有解脫汝等搭衣之時淨身口意至心頂戴默誦呪偈次展披搭若受食赴齋之時端身趺坐開巾展鉢誦偈安庠盛物之後左手持鉢右手扶緣直身正念供養三寶至誠作觀取次下匙祖家不云五觀無違三匙有節如上教示如法受用若不遵行罪貽於後所有受持衣鉢軌則候臨壇曰吾往屏處問難時準根本律部方乃教持汝等自今已後凡欲製造衣鉢應須請問明師如法裁造無恣自心有違聖制若衣成已必請一知律師僧依法加持信受披搭功不唐捐必獲勝益是名末世僧寶真正比丘汝等能依教奉行否答云依教奉行引禮云諸沙彌一齊起立聞磬聲作禮三拜撩衣拜已起具分班迎請者送師歸寮送師已回至作法所謝諸引禮師畢各各持己衣鉢除還本堂審戒懺悔第五沙彌進具時所問十三重難十六輕遮必在十師臨壇和僧作法方差教授師往屏處詳問次復召入僧中羯磨師憑衆再審事辦一朝法無隔宿如此兩番詳詰諸律文同一往受具者皆於隔宿請師預問既不待羯磨所差又非是正授具曰嗟夫深違佛敕遺誤逮斯今準南山古儀原遵佛制唯於隔宿審詰沙彌十戒次曰登壇方差問二十九種輕重難遮願諸弘戒者剪革沿式以奉聖規是所幸也此番作法更當整肅良以具足大戒尊嚴而僧伽之數難入且今去佛時遙法多情弊若不藉以殊勝外緣曷能發彼上品因心是以即於請戒後日分引禮師先令淨人或沙彌灑掃法堂中敷一座供列香花莊飾幡蓋於正座屏後設書記師位堂左頰門外設驗籤師位堂右頰門外設繳籤師位處處燈懸光逾白晝在在香爇篆藹祥雲供設既備即鳴楗椎集諸求具沙彌照籤班次排列引禮將五人往請羯磨師執香者在前至寮作禮請師至堂禮佛就座拈香舉讚畢引禮云上香復位迎請者先出班聞磬聲作禮三拜歸班受差驗繳二師出衆向座一觸禮起立座上師其出位答禮自宜相諒羯磨師云幢樹毗尼唯在匡扶正法堂開懺悔用資佐助諸緣今諸沙彌欲求進具理合露懺防有白衣等溷入盜聽故請二師詳查出入彼若如法清淨我等作辦方成但恐坐久疲勞願生歡喜叉手答事如命驗繳二師向上叉手問訊兩分左右各詣頰門就位而坐次書記師出衆向上一觸禮而立羯磨師云勤䇿近圓當淨身意干犯則律不許容無染則戒方可受今夜班多人衆事或雷同故請大德注明人事不致差誤以便呈簡和尚願勿厭其煩瑣叉手答云如命答已向上叉手問訊却後就本位衆巡視大德向座一觸禮起立羯磨師云律制森嚴人心易怠須假勝緣克成善業今諸沙彌於發露時或恐昏散忘誤懺摩故請衆大德檢巡察視整肅懺儀令彼三業翹勤一心無怠可謂曲己成人幸勿辭勞衆齊叉手答云如命答已向上叉手問訊而出各備提燈嚴肅清察引禮云諸沙彌汝等各各至誠隨我音聲朗誦大悲神呪仗此密言威神力故淨潔法筵遠諸魔障齊聲朗誦三遍已舉南無甘露王菩薩摩訶薩三稱引禮云諸沙彌等一齊向上排班展具聞磬聲作禮三拜撩衣拜已長跪合掌夫七衆以比丘為首三聚以具戒為尊須求淨器受彼醍醐合選良材斫成梁棟運斤在於大匠陶冶不越輪繩今為汝等恭請某某律師作審戒懺悔阿闍黎請師之語汝合自陳恐汝未能我今教汝各稱法名稱已其餘言詞皆隨我道大德一心念我沙彌某甲等今請大德為審戒懺悔阿闍黎願大德為我作審戒懺悔阿闍黎我依大德故得如實懺悔慈愍故三請三禮羯磨撫尺云夫戒淨而定慧生乃佛祖修證之道本惑起而貪愛具是有情輪回之苦因斯惟智者覺照愚者迷淪汝等既能厭苦捨家受持沙彌十戒復欲增進勤修願入比丘僧倫如是則何患定慧不生而輪回不息但慮汝等本所受持禁戒之中或性重條章有毀或息慈名德有虧縱欲近圓恐無所獲薩婆多論云若破沙彌十戒中重者若受具戒及禪無漏戒若欲勝進一切不得良以沙彌戒是比丘戒之原基也譬如樹根充潤花果敷實亦如地址堅牢樓閣任興未有無根企果而無址架閣者是故我今於請戒開導之次欽遵律制逐一問汝汝等隨其所問逐一實答不得以有言無以重説輕倘有一念覆諱豈但內欺於心外欺於師抑且欺誑十方諸佛菩薩諸天善神而舊罪不除新殃更積如是則惡道不怖慚愧不生誠為可憐愍者是故汝等人人信力決定生大怖畏生大慚愧思惡道苦發菩提心傾誠發露真切懺悔礦砂淨盡方是精金瑕疵少存尤非良璧鳴尺一下汝等能如是懺悔否衆答依教奉行引禮云諸沙彌一齊起立聞磬聲作禮三拜撩衣拜已起具分班汝等為首者統衆集候待呼召時九人次第從左頰門至驗籤師所逐一照名而進到師座前發露竟九人次第從右頰門至繳籤師所逐一依次而出今留第一班在堂餘者暫出衆出已復呼云第一班近前向上排班堂寬一行列定堂窄前後兩班展具聞磬聲作禮三拜撩衣拜已長跪合掌作觀運心齊稱南無十方常住三寶三稱已各稱自己法名稱畢師撫尺云諸沙彌我今詳問汝等本所受持十支戒相者正是浣汝身心蠲除不淨遴選道器攝入僧倫應須各解我語確實而答鳴尺一下第一不殺生戒者凡物有命不得故殺若自殺若教他殺若坑陷殺若倚發殺若推墮殺若呪術殺若毒藥殺若勸他殺若先知彼人意欲自死故安殺具令死若令惡獸毒蛇殺乃至墮胎破卵焚山決瀆皆名曰殺汝等於此戒中曾有犯否若犯即實答犯某殺傍人不得教答無也蓋犯戒由於自心懺悔必須自言若是傍人教之斯皆得越毗尼罪下之九戒亦如是若真正無犯方可答云無是中犯者準律判定以明輕重罪相若殺人類者犯重是性戒破根本失沙彌戒名滅擯突吉羅不通懺悔不得與餘清淨沙彌同宿同事不得如餘清淨沙彌與諸比丘二宿三宿若殺天龍鬼神能變形解語者犯中罪許容悔名應懺突吉羅若殺畜生不能變形解語者犯下罪許容悔亦名應懺突吉羅若殺人類不死者犯中方便罪若殺天龍乃至畜類不死者犯下方便罪若助他令殺人若天等畜類死不死皆同上本罪輕重若見殺不起慈心反讚美隨喜者犯方便中罪許容悔比丘五篇六聚罪名沙彌不得預知所以言中下罪又言中下方便其實總攝一應懺突吉羅而云中下者由犯戒之心有熾盛煩惱有軟煩惱不同是以隨分中下於下九戒事義亦然若弒父母聖人犯逆罪墮阿鼻地獄更重於上殺雖是一事不同科如初壇審弒父母及殺惡中所明第二盜戒者凡是有主物不得盜心故取若自取若教他取若受教代他往取若呪術取若因寄取若與已更奪取若貸借不還乃至偷稅冒渡等皆名曰盜汝等於此戒曾有犯否若犯某盜即實答言犯某盜若果無犯者方答云無是中犯者不論新故貴賤之物若盜取直五錢犯重是性戒破根本失沙彌戒名滅擯突吉羅罪不通懺悔不得與餘沙彌同宿同事不得如餘沙彌與諸比丘二宿三宿五錢者準此方錢算是八十文以銀數算之即八分也若盜減五錢自四錢以下犯中罪許容悔名應懺突吉羅罪若盜五錢以上不滿十錢者仍總是一重罪若滿十錢即犯二重罪若盜直多多五錢按錢所犯亦多多重罪若盜三寶物者計直多少定罪輕重與此同科然重罪言多多者是佛真實語憐愍持戒七衆弟子令勿毀犯示其地獄苦報倍更轉增難脫離故第三淫戒者若與人男人女作不淨行或己淫他或他淫己乃至共畜生者皆名曰淫汝等於此戒中曾有犯否若犯某淫即實答犯某淫若無答云無是中犯者凡有淫欲心和合作事竟皆犯重是性戒破根本失沙彌戒名滅擯突吉羅罪不通懺悔不得與餘沙彌同宿同事不得如餘沙彌與諸比丘二宿三宿若有淫欲心未和合而即止犯中罪許容悔名應懺突吉羅罪若以淫欲心與女人身相觸與女人屏處坐屏處語皆犯中罪許容悔名應懺突吉羅罪第四妄語戒者若未曾悟道妄言已悟若未得禪得定妄言已得若未證四果妄言已證乃至妄言天龍神鬼等來如此虗而不實誑惑世人皆名大妄語汝等於此戒中曾有犯否若曾向人説某妄語即當實答曾犯某妄語若果無者方答云無更有妄語綺語兩舌惡口皆名曰小妄語汝等於此戒中曾有犯否若犯某妄語即實答犯某妄語若無答云無是中犯者若是大妄語向前人説彼解語了了犯重是性戒破根本失沙彌戒名滅擯突吉羅罪不通懺悔不得與餘沙彌同宿同事不得如餘沙彌與諸比丘二宿三宿若本意是説大妄語或説不明了前人不領解或正説時即中止並犯中罪許容悔名應懺突吉羅罪若小妄語説而不了了令作責心突吉羅悔除後莫更為以上四戒乃一切戒之根本也第五不飲酒戒凡一切能醉人者一滴不可入口汝等於此中曾有犯否若有犯即實答犯若無答云無是中犯者若五穀及花果等已作成酒者乃至酒酒糟但有酒香酒味作酒想入口下咽能醉犯遮戒許容悔名應懺突吉羅罪若患重病醫必用酒煮藥而治者當先白師師允方服要無酒香酒味入唇不作酒想可爾若重即斷則不犯如若因病時以酒煮藥病差復飲用者仍犯本罪第六不著香花鬘不香油塗身戒汝等於此中曾有犯否若犯某事即實答犯某事若果無犯答云無是中犯者若此土用繒絨珍寶製飾巾冠者類乎西域著花鬘也若此土用香熏衣帳及密佩香囊者亦類西域以香塗身也按律藏中佛有隨國風之説非無據也故知國風服用之事雖殊而喜好玩飾之心是一若有作如此事者犯遮戒許容悔名應懺突吉羅罪第七不歌舞倡伎不故往觀聽戒汝等於此中曾有犯否若犯某事即實答犯某事若果無答云無是中犯者若唱曲謳吟名之為歌若掉臂躑足名之為舞若吹簫彈琴雙陸圍棋擲骰博錢投壺射箭乃至馳馬拭劍等皆名倡伎若自作若見聞喜樂故意往觀味聽者一一俱犯遮戒許容悔名應懺突吉羅罪第八不坐高廣大牀戒汝等於中曾有犯否若有答有犯若無者答云無今世末法處處僧牀皆非應量而為師者臨時問至此當深生慚愧必也知違佛制庶幾可爾不然則兒戲毗尼故為故問矣是中犯者律制僧牀但許足高一尺六寸若以周尺言之一尺止今匠尺八寸一尺六寸準匠尺有一尺二寸八分坐時令足不挂空若過此量名之為高廣者恣縱轉臥既高且廣故名大牀用者犯遮戒許容悔名應懺突吉羅罪若得已成者截足應量不犯第九不非時食戒汝等於中曾有犯否若有犯答有犯若無犯者答云無是中犯者以時為制時者從東方明相始出乃至日午正中非時者從日稍側乃至次日明相未出若於非時食噉一切有形之物皆名破齋犯遮戒許容悔名應懺突吉羅罪若病飢者許取一切穀豆麥煎不破皮濾汁非時得飲乃至種種漿以水作淨已可用第十不捉持生像金銀寶物戒汝等於中曾有犯否若犯某即實答犯某事果若無答云無是中犯者生謂生而質具如金銀珠玉珊瑚瑪瑙水晶硨磲琉璃琥珀玻璃玳瑁文犀象牙一切奇珍之物是也像謂造作成像若錢鈔一切金銀七寶造作之器而成種種形狀之類是也斯皆長人貪心有違高尚之志故佛不聽捉持若捉持如是者犯遮戒許容悔名應懺突吉羅罪若為三寶及師長父母掌舉不作己物想者則不犯如是九人一一詳審已於中若有犯四根本性重戒者書記注筆登册次日呈白和尚若有犯後六種輕戒者羯磨師即座如律稱量教令懺悔引禮云頂禮一拜而起第一籤從右邊下至繳籤師所逐一依次出堂待第一籤九人轉下從右已去復呼云第二籤左邊上至驗籤師所逐一照名進堂如是班次多少一一呼應乃至末後一籤不須出堂但起立於右即鳴椎集先發露者各隨班次入堂兩序而立其奉差驗繳及巡視等出衆向座一齊叉手問訊驗籤者白云我某甲等奉和尚差事已畢班次不減出進如法巡視密嚴動止安庠無有犯威儀者羯磨師云佐助有功夜深神惓各請安息諸位作辭而退各還本所書記出衆呈册於座向上義手問訊白云我某甲奉和尚差委登記所問罪相今諸沙彌根本無犯悉皆清淨白羯磨師轉白和尚此中若犯四重者此文改云今諸沙彌發露中唯某甲有犯律章餘悉清淨白羯磨師轉白和尚羯磨師如前慰勞已書記復再義手問訊辭退出堂歸寮引禮云諸沙彌一齊展具聞磬聲作禮三拜撩衣拜已長跪合掌師撫尺云諸沙彌我今遵律已詳問汝等汝等各各解我語言一一答竟諒無餘蘊庶幾身器清淨可爾登壇得圓具戒然於登壇之日屏處及與僧中仍問汝等四重根本汝等亦如今夜在我座前諦實而答此時更為汝等拈香懇禱諸佛加庇衆聖證明願多生所積之愆尤從今殄滅無始未行之善業自此勤修汝今衆人各各觀想十方諸佛隨我言音至誠懺悔各稱法名稱已師起立拈香畢復坐義手至誠作梵舉云往昔所造諸惡業皆繇無始貪瞋癡一切罪障皆從身語意之所生今對佛前求懺悔一切罪根皆懺悔功德殊勝行無邊勝福皆回向普願沈溺諸有情速往無量光佛剎十方三世一切佛一切菩薩摩訶薩摩訶般若波羅蜜引禮云諸沙彌一齊起立聞磬聲禮謝三拜撩衣拜已起具分班引禮導為首沙彌如常禮送師歸寮仍回法堂教衆沙彌普同上殿各秉虔恭徹夜禮佛其諸沙彌謝引禮師畢即至大殿然燭焚香三業至誠能所皆空如實頂禮以上沙彌犯重者毗尼制教不通懺悔若觀彼沙彌雖已破重而有真實慚愧革過從新者可依大乘方便救令其深怖地獄永息世緣擇處結壇哀切苦到或一七二七求見好相罪方得殄如其不見或積歲月必以見相為期戒方許受為恐因緣難阻不能如法建壇縱能建壇倘若好相不現則後悔難追莫若慎之於始惓惓守持為善也
